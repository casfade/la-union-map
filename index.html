.location-note{font-size:12px;color:#666;margin:-4px 0 12px}.location-inline{background:none;padding:0;color:#333;text-decoration:underline;font-size:12px}.landmark-main{min-width:0;padding:17px 16px;display:flex;flex-direction:column;justify-content:center}.landmark-go{display:none}

.detail-cover{height:220px}.detail-name-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.detail-name{font-size:22px;font-weight:700;line-height:1.15}.status-pill{font-size:11px;font-weight:700;white-space:nowrap}

/* =========================================================

   Presentation layer only. V43 data, routes and behaviors remain.

:root{
  --ink:#11110f;
  --muted:#716f69;
  --line:rgba(17,17,15,.11);
  --bg:#11110f;
  --card:#f7f3e9;
  --radius:24px;
  --gap:14px;
  --max:760px;
  --tab:#f3efe5;

  --food:#f5a36a;
  --drink:#c8e8d5;
  --dessert:#f0c9e4;
  --nightlife:#c7b8ee;
  --activities:#a9dfe7;
  --landmarks:#e8d39a;
  --transport:#cbd9f0;
  --emergency:#ef8e83;
}
html,body{
  font-family:"DM Sans",Arial,Helvetica,sans-serif;
  background:#11110f;
  color:#f7f3e9;
}
body{font-size:15px;overflow-x:hidden}
.app{max-width:760px;background:#11110f;min-height:100vh;padding-bottom:100px}
.page{padding:18px 18px 38px}
.landing{padding:16px 18px 44px;min-height:100vh;background:#11110f}
button,input{font-family:"DM Sans",Arial,sans-serif}
button{transition:transform .18s ease,opacity .18s ease,background .22s ease}
button:active,.card:active,.feature-card:active{transform:scale(.985)}
*{-webkit-tap-highlight-color:transparent}

/* Home */
.home-header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 34px}
.brand-mark{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;color:#f7f3e9}

.header-dot{width:11px;height:11px;border-radius:50%;background:#f5a36a;box-shadow:0 0 0 5px rgba(245,163,106,.10)}

  position:relative;aspect-ratio:16/8.5!important;height:auto!important;border-radius:25px;

.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.category-card{
  position:relative;min-height:148px!important;border:0!important;border-radius:24px!important;
  padding:18px!important;text-align:left!important;background:var(--c)!important;color:#111!important;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
}
.category-card:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-28px;top:-25px;background:rgba(255,255,255,.16)}
.category-food{--c:var(--food)}
.category-drink{--c:var(--drink)}
.category-dessert{--c:var(--dessert)}
.category-nightlife{--c:var(--nightlife)}
.category-activities{--c:var(--activities)}
.category-landmarks{--c:var(--landmarks)}
.category-icon{width:30px;height:30px;display:flex;align-items:center}
.category-icon svg{width:27px;height:27px;fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.category-name{font-family:"Space Grotesk",sans-serif;font-size:23px;letter-spacing:-.035em;font-weight:600;line-height:1}
.category-arrow{position:absolute;right:16px;bottom:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(17,17,15,.10)}
.category-arrow svg{width:15px;height:15px;fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Secondary pages */
.themed-page{min-height:calc(100vh - 100px);color:#111}
.themed-page.theme-food{--theme-bg:var(--food);--theme-ink:#2a1710}
.themed-page.theme-drink{--theme-bg:var(--drink);--theme-ink:#102018}
.themed-page.theme-dessert{--theme-bg:var(--dessert);--theme-ink:#261521}
.themed-page.theme-nightlife{--theme-bg:var(--nightlife);--theme-ink:#1b1428}
.themed-page.theme-activities{--theme-bg:var(--activities);--theme-ink:#102126}
.themed-page.theme-landmarks{--theme-bg:var(--landmarks);--theme-ink:#2a2110}
.themed-page.theme-transport{--theme-bg:var(--transport);--theme-ink:#172033}
.themed-page.theme-emergency{--theme-bg:var(--emergency);--theme-ink:#291313}
.themed-page{background:var(--theme-bg);color:var(--theme-ink)}
.themed-page .top .back,.themed-page .top .crumb{background:rgba(255,255,255,.48);border-color:rgba(0,0,0,.08);color:var(--theme-ink);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.themed-page .back{font-family:"DM Sans",sans-serif;font-size:26px}
.themed-page .crumb{font-family:"Space Grotesk",sans-serif;font-weight:600}
.themed-page .cover{border:0;box-shadow:0 14px 30px rgba(0,0,0,.10)}
.themed-page .cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.20))}
.themed-page .card{border:0;box-shadow:0 7px 22px rgba(0,0,0,.08);background:#f9f6ee}
.themed-page .brand-title,.themed-page .landmark-name,.themed-page .transport-name,.themed-page .em-name{font-family:"Space Grotesk",sans-serif}
.themed-page .category-section-title,.themed-page .section-title,.themed-page .detail-section h3,.themed-page .detail-label{color:rgba(0,0,0,.52)}
.themed-page .sorts button{border-color:rgba(0,0,0,.10);background:rgba(255,255,255,.45);color:var(--theme-ink);border-radius:999px}
.themed-page .sorts button.active{background:var(--theme-ink);color:#fff;border-color:var(--theme-ink)}
.themed-page .cuisine-chip{border:0}
.themed-page .btn{background:var(--theme-ink);color:#fff}
.themed-page .btn.light{background:rgba(255,255,255,.55);color:var(--theme-ink)}
.themed-page .detail-section,.themed-page .hours-calendar-card{border:0;background:rgba(255,255,255,.52);box-shadow:none}
.themed-page .hours-day-card{border-color:rgba(0,0,0,.08);background:rgba(255,255,255,.40)}
.themed-page .hours-line{border-color:rgba(0,0,0,.08)}
.themed-page .location-note,.themed-page .meta,.themed-page .distance,.themed-page .desc,.themed-page .landmark-desc,.themed-page .transport-desc,.themed-page .em-desc{color:rgba(0,0,0,.58)}
.themed-page .tag{border-color:rgba(0,0,0,.11)}
.themed-page .status-banner,.themed-page .status-pill{border-radius:999px}

/* Cards */
.brand-card{grid-template-columns:128px minmax(0,1fr);min-height:136px;border-radius:22px!important}
.brand-image{background:#ded8ca}
.brand-body{padding:15px 16px 16px}
.brand-title{font-size:17px}
.price{font-family:"Space Grotesk",sans-serif;font-size:12px}
.distance{font-size:12px;margin-top:5px}
.desc{font-size:12.5px;line-height:1.42}
.highlight{font-size:12px;margin-top:9px}
.tags{margin-top:9px}
.tag{font-size:10px;padding:4px 8px;background:rgba(255,255,255,.20)}
.cuisine-chip{margin-top:8px;font-size:10px;padding:5px 9px;font-weight:700;border:0}
.status-banner{padding:6px 10px;font-size:9px;letter-spacing:.02em}

/* Detail */
.detail-cover{height:250px}
.detail-name{font-family:"Space Grotesk",sans-serif;font-size:32px;letter-spacing:-.045em}
.detail-name-row{margin:16px 1px 12px}
.cuisine-banner{font-size:11px;border-radius:999px;padding:8px 11px;background:rgba(255,255,255,.45);display:inline-flex}
.detail-actions{margin-top:14px}
.detail-actions .btn{height:48px;border-radius:15px}
.detail-section{border-radius:22px;padding:18px;margin-top:12px}
.detail-section h3{font-size:10px;letter-spacing:.15em}
.detail-section p{font-size:14px}
/* V111 — make the Location card clickable with the same palette/function as Maps */
.themed-page .location-card{display:block;text-decoration:none;background:var(--theme-ink)!important;color:#fff!important;cursor:pointer;transition:opacity .15s ease}
.themed-page .location-card h3{color:rgba(255,255,255,.62)!important}
.themed-page .location-card p{color:#fff!important}
.themed-page .location-card:hover{opacity:.92}
.themed-page .location-card:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:3px}
.hours-calendar-card{border-radius:22px;margin:12px 0;padding:16px}
.hours-day-card{border-radius:13px}
.location-note{font-size:11px}


/* V102 — HOURS uses the exact same outer treatment as HIGHLIGHT */
.themed-page .hours-calendar-card{
  border-radius:22px!important;
  padding:18px!important;
  margin:12px 0 0!important;
  border:0!important;
  background:rgba(255,255,255,.52)!important;
  box-shadow:none!important;
}
.themed-page .hours-calendar-card .detail-label{
  font-size:10px!important;
  font-weight:700!important;
  letter-spacing:.15em!important;
  line-height:normal!important;
  color:rgba(0,0,0,.52)!important;
  margin:0 0 8px!important;
}

/* Navigation */
.bottom-tabs{
  gap:4px;bottom:12px;width:min(calc(100% - 28px),520px);padding:7px;
  border:1px solid rgba(255,255,255,.10);background:rgba(25,25,23,.90);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.32)
}
.bottom-tabs button{color:#7f7c75;font-size:10px;font-weight:600;border-radius:17px;padding:7px 4px;transition:all .2s ease}
.bottom-tabs button:hover{color:#f7f3e9;background:rgba(255,255,255,.05)}
.bottom-tabs svg{width:21px;height:21px;stroke:#8e8b83;stroke-width:1.8}
.bottom-tabs button:nth-child(1):active svg,.bottom-tabs button:nth-child(2):active svg,.bottom-tabs button:nth-child(3):active svg{stroke:#fff}

/* Utility pages */
.transport-tabs{gap:7px}
.transport-tabs button{height:44px;border-radius:999px;background:rgba(255,255,255,.45);color:var(--theme-ink)}
.transport-tabs button.active{background:var(--theme-ink);color:#fff}
.profile{border-radius:17px}
.landmark-card{border-radius:20px;padding:0!important}
.landmark-icon{width:100%;height:92px;border-radius:0;background:rgba(255,255,255,.45)}
.landmark-icon svg{width:25px;height:25px;fill:none;stroke:var(--theme-ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.landmark-go{border-radius:999px!important;height:38px!important}
.em-row{border-radius:20px;padding:15px!important}
.em-name{display:flex;align-items:center;gap:9px}
.em-name svg{width:21px;height:21px;fill:none;stroke:var(--theme-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.em-row .call{border-radius:999px}

/* Location modal */
.location-modal{background:rgba(0,0,0,.58);backdrop-filter:blur(8px)}
.location-sheet{background:#f7f3e9;color:#111;border-radius:28px;padding:27px 21px 18px}
.location-sheet h3{font-family:"Space Grotesk",sans-serif;font-size:25px;letter-spacing:-.03em}
.location-sheet p{color:#6f6c65}
.location-icon{height:50px;width:50px;margin:0 auto 8px;border-radius:17px;background:#a9dfe7;display:flex;align-items:center;justify-content:center}
.location-icon svg{width:25px;height:25px;fill:none;stroke:#102126;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.location-sheet .primary{border-radius:15px;background:#11110f;height:50px}
.location-skip{font-size:12px}

/* Empty states */
.empty{background:rgba(255,255,255,.45);border:0;color:rgba(0,0,0,.55);border-radius:20px;padding:24px}
.landing .empty{background:#1b1b19;color:#85827b}

/* Responsive */
@media(max-width:600px){
  .page{padding-left:16px;padding-right:16px}
  .landing{padding-left:16px;padding-right:16px}
  .hero-copy h1{font-size:56px}
  .category-card{min-height:135px!important}
  .category-name{font-size:21px}
}
@media(max-width:390px){
  .brand-card{grid-template-columns:104px minmax(0,1fr)}
  .brand-body{padding:13px}
  .hero-copy h1{font-size:50px}
  .category-card{min-height:125px!important;padding:15px!important}
  .category-name{font-size:19px}
}


/* V46 — bottom navigation uses the same SVG icon language as category cards */
.bottom-tabs .tab-category-icon{
  width:21px;height:21px;display:flex;align-items:center;justify-content:center;
}
.bottom-tabs .tab-category-icon svg{
  width:21px;height:21px;fill:none;stroke:#8e8b83;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.bottom-tabs button:hover .tab-category-icon svg,
.bottom-tabs button:active .tab-category-icon svg{stroke:#f7f3e9}


/* V48 — typography-first category/page covers */
.category-cover{
  height:180px!important;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-start;
  padding:22px 20px!important;
  overflow:hidden;
  background:transparent!important;
  box-shadow:none!important;
  border:0!important;
}
.category-cover:after{display:none!important}
.category-cover-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  opacity:.52;
  margin-bottom:8px;
}
.category-cover-title{
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(54px,13vw,92px);
  line-height:.84;
  letter-spacing:-.065em;
  font-weight:600;
  text-transform:none;
}
@media(max-width:600px){
  .category-cover{height:165px!important;padding:18px 16px!important}
  .category-cover-title{font-size:64px}
}
@media(max-width:390px){
  .category-cover-title{font-size:57px}
}


/* V49 — category title aligned to the content/card edge */

  padding-left:0!important;

}

  margin-left:0;

function distanceKm(a,b,c,d){const R=6371, p=Math.PI/180, x=(c-a)*p, y=(d-b)*p;const q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
function distanceText(lat,lon){
  if(lat==null || lon==null) return "Location not mapped";
  if(!userPos) return "Enable location to see drive time";
  const d=distanceKm(userPos.lat,userPos.lon,lat,lon);
  if(!Number.isFinite(d)) return "Drive time unavailable";
  const minutes=Math.max(1,Math.round((d*1.25/30)*60));
  return "~"+minutes+" min by car";
}

function parseTime(s){
  let m=String(s||"").match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i); if(!m)return null;
  let h=+m[1], min=+(m[2]||0), ap=(m[3]||"").toUpperCase();
  if(ap==="PM"&&h<12)h+=12;
  if(ap==="AM"&&h===12)h=0;
  return h*60+min;
}
function dayKey(){return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];}
function fmtTime(mins){
  let h=Math.floor((mins%1440)/60), m=mins%60, ap=h>=12?"PM":"AM", hh=h%12||12;
  return hh+(m?":"+String(m).padStart(2,"0"):"")+ap;
}
function todaySlots(p){
  let h=p.hours||{};
  return h[dayKey()] ?? h.Daily ?? [];
}
function status(p){
  let slots=todaySlots(p);
  let now=new Date().getHours()*60+new Date().getMinutes();
  if(Array.isArray(slots)){
    const parsedSlots=slots.map(slot=>({open:parseTime(slot[0]),close:parseTime(slot[1])}))
      .filter(slot=>slot.open!=null&&slot.close!=null)
      .sort((a,b)=>a.open-b.open);

    for(const slot of parsedSlots){
      let end=slot.close;
      if(end<=slot.open) end+=1440;
      let n=now;
      if(n<slot.open && end>1440) n+=1440;
      if(n>=slot.open && n<end){
        let remaining=end-n;
        return {label:remaining<=60?"CLOSING SOON":"OPEN TIL "+fmtTime(end),kind:remaining<=60?"soon":"open"};
      }
    }

    // A gap between two scheduled periods on the same day is a break,
    // not a full-day closure. Show BREAK TIME during that gap.
    for(let i=0;i<parsedSlots.length-1;i++){
      const currentEnd=parsedSlots[i].close;
      const nextOpen=parsedSlots[i+1].open;
      if(currentEnd < nextOpen && now>=currentEnd && now<nextOpen){
        return {label:"RESUMES "+fmtTime(nextOpen),kind:"break"};
      }
    }
  }

  // When closed, show the next scheduled opening. If it is within 60 minutes,
  // use the same visual treatment as "CLOSING SOON" but label it "OPENING SOON".
  const h=p.hours||{};
  const dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  for(let offset=0; offset<7; offset++){
    const idx=(new Date().getDay()+offset)%7;
    const day=dayNames[idx];
    const daySlots=h[day] ?? h.Daily ?? [];
    if(!Array.isArray(daySlots)) continue;
    for(const slot of daySlots){
      const open=parseTime(slot[0]);
      if(open==null) continue;
      if(offset===0 && open<=now) continue;
      const minutesUntilOpen=(offset*1440)+open-now;
      if(minutesUntilOpen>=0 && minutesUntilOpen<=60){
        return {label:"OPENING SOON",kind:"opening-soon"};
      }
      return {label:"OPENS "+fmtTime(open),kind:"closed"};
    }
  }
  if(!Object.keys(h).length) return {label:"HOURS NOT VERIFIED",kind:"closed"};
  return {label:"CLOSED",kind:"closed"};
}

}

function forwardScrollTop(){

function routeHash(state){
  if(!state || state.view==="home") return "";
  if(state.view==="category") return "#/category/"+encodeURIComponent(state.cat||"");
  if(state.view==="brand") return "#/brand/"+encodeURIComponent(state.id||"");
  if(state.view==="page") return "#/page/"+encodeURIComponent(state.page||"");
  return "";
}
function stateFromHash(){
  const h=location.hash.replace(/^#\/?/,"");
  if(!h) return {luApp:true,view:"home"};
  const parts=h.split("/");
  const type=parts[0];
  const value=decodeURIComponent(parts.slice(1).join("/"));
  if(type==="category" && value) return {luApp:true,view:"category",cat:value};
  if(type==="brand" && value) return {luApp:true,view:"brand",id:value};
  if(type==="page" && value) return {luApp:true,view:"page",page:value};
  return {luApp:true,view:"home"};
}
function setRoute(state){
  const url=new URL(location.href);
  url.hash=routeHash(state);
  const current=history.state && history.state.luApp ? history.state : null;
  const next=Object.assign({luApp:true},state);
  if(current){
    next.from={view:current.view,cat:current.cat||"",id:current.id||"",page:current.page||""};
    next.fromScroll=window.scrollY||document.documentElement.scrollTop||0;
  }
  history.pushState(next, "", url.href);
}
function appBack(){
  const s=history.state;
  if(s && s.luApp){
    if(s.view==="home"){
      renderHome();
      return;
    }
    history.back();
    return;
  }
  if(location.hash){
    history.back();
    return;
  }
  renderHome();
}

/* V118 — prevent accidental mobile horizontal browser-navigation gestures.
   The app only needs vertical page scrolling, so horizontal touch panning is
   intentionally disabled at the page level. This avoids an edge swipe being
   interpreted as browser Back while preserving normal taps and vertical scroll. */
/* V105 — disable custom swipe-back navigation.
   The app no longer has a visible Back button, and the previous custom
   touch handler could interpret an accidental edge swipe as navigation.
   Browser/native gestures remain available where the platform supports them. */
function renderRoute(state){
  luRouting=true;
  try{
    state=state && state.luApp ? state : stateFromHash();
    if(!state || state.view==="home") renderHome();
    else if(state.view==="category") showCategory(state.cat,true);
    else if(state.view==="brand") brandDetail(state.id,true);
    else if(state.view==="page") showPage(state.page,true);
  }finally{ luRouting=false; }
}
window.addEventListener("popstate",function(e){
  const state=e.state || stateFromHash();
  renderRoute(state);
  if(state && state.view!=="brand" && Number.isFinite(state.fromScroll)){
    requestAnimationFrame(function(){
      window.scrollTo(0,state.fromScroll);
      document.documentElement.scrollTop=state.fromScroll;
      document.body.scrollTop=state.fromScroll;
    });
  }
});
function syncRouteOnHash(){
  if(luRouting) return;
  const state=stateFromHash();

}

function isClosedForSort(p){
  const s=status(p);

  // "HOURS NOT VERIFIED" is not treated as confirmed closed.

function sortCategoryBrands(arr,mode){
  const out=arr.slice();
  // Closed shops always stay at the bottom, regardless of distance, price,
  // or name. Among non-closed shops, use the selected sort criterion.
  out.sort((a,b)=>{
    const ac=isClosedForSort(a), bc=isClosedForSort(b);
    if(ac!==bc) return ac?1:-1;
    if(mode==="alpha") return a.name.localeCompare(b.name);
    if(mode==="price") return priceValue(a)-priceValue(b) || a.name.localeCompare(b.name);
    return distanceVal(a)-distanceVal(b) || a.name.localeCompare(b.name);
  });
  return out;
}

function nearbySorted(mode){
  const arr=DATA.brands.slice();
  arr.sort((a,b)=>{
    const ac=isClosedForSort(a), bc=isClosedForSort(b);
    // Closed shops always go below every shop that is not currently closed.
    if(ac!==bc) return ac?1:-1;
    if(mode==="alpha") return a.name.localeCompare(b.name);
    if(mode==="price") return priceValue(a)-priceValue(b)||a.name.localeCompare(b.name);
    const distanceDiff=distanceVal(a)-distanceVal(b);
    if(distanceDiff) return distanceDiff;
    return a.name.localeCompare(b.name);
  });
  return arr;
}

function locationErrorText(err){
  if(err && err.code===1) return "Location permission is blocked. Allow location for this site in your browser, then tap Try Again.";
  if(err && err.code===2) return "Your device could not determine your location. Turn on GPS/location services, then tap Try Again.";
  if(err && err.code===3) return "Location request timed out. Tap Try Again.";
  return "Your exact location is not available yet. Tap Try Again.";
}
function enableLocation(){
  if(!navigator.geolocation){

  navigator.geolocation.getCurrentPosition(pos=>{
    userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};

/* Urbiztondo, San Juan, La Union — current condition + next 4 hourly forecasts. */
const SAN_JUAN_WEATHER={lat:16.6589,lon:120.3313};
function weatherLabel(code){
  if(code===0) return 'SUNNY';
  if(code===1||code===2) return 'PARTLY CLOUDY';
  if(code===3) return 'CLOUDY';
  if(code===45||code===48) return 'FOGGY';
  if((code>=51&&code<=67)||(code>=80&&code<=82)) return 'RAINY';
  if(code>=95) return 'STORMY';
  return 'CLOUDY';
}
function weatherIcon(code,isDay){
  const sun='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>';
  const moon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 15.2A7.5 7.5 0 0 1 8.8 5a7.8 7.8 0 1 0 10.2 10.2Z"></path></svg>';
  const cloud='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10.5a3.5 3.5 0 0 0 .4-7A5.5 5.5 0 0 0 7.3 9.2 4.4 4.4 0 0 0 7 18Z"></path></svg>';
  const rain='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14.5h10.5a3.5 3.5 0 0 0 .3-7A5.5 5.5 0 0 0 7.3 5.7 4.4 4.4 0 0 0 7 14.5Z"></path><path d="M9 17l-1 2M13 17l-1 2M17 17l-1 2"></path></svg>';
  const storm='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-8 12h6l-2 8 8-12h-6l2-8Z"></path></svg>';
  if(code===0) return isDay?sun:moon;
  if(code===1||code===2) return cloud;
  if(code===3||code===45||code===48) return cloud;
  if((code>=51&&code<=67)||(code>=80&&code<=82)) return rain;
  if(code>=95) return storm;
  return cloud;
}
async function loadSanJuanWeather(){
  const root=document.getElementById('homeWeather');
  if(!root) return;
  try{
    const url='https://api.open-meteo.com/v1/forecast?latitude='+SAN_JUAN_WEATHER.lat+'&longitude='+SAN_JUAN_WEATHER.lon+'&current=weather_code,is_day&hourly=weather_code,is_day&forecast_days=2&timezone=Asia%2FManila';
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('Weather request failed');
    const data=await res.json();
    const h=data.hourly;
    const c=data.current;
    if(!h || !Array.isArray(h.time) || !Array.isArray(h.weather_code) || !c || c.weather_code===undefined) throw new Error('Incomplete weather data');

    /* Use the API's actual current condition for the first slot. Do not infer
       "now" by parsing browser-local dates, which can shift the hour on mobile. */
    const currentTime=String(c.time||'');
    let start=h.time.findIndex(t=>t===currentTime);
    if(start<0){
      start=h.time.findIndex(t=>t>currentTime);
      if(start<0) start=Math.max(0,h.time.length-5);
    }

    const hours=[0,1,2,3,4].map(i=>{
      const idx=start+i;
      return {time:h.time[idx],code:h.weather_code[idx],isDay:h.is_day?.[idx] ?? 1};
    });
    if(hours.some(w=>!w.time || w.code===undefined)) throw new Error('Incomplete hourly forecast');

    const current={time:currentTime,code:c.weather_code,isDay:c.is_day ?? 1};
    root.querySelectorAll('.weather-hour').forEach((el,i)=>{
      const w=i===0?current:hours[i];
      const timeEl=el.querySelector('.weather-time');
      const iconEl=el.querySelector('.weather-icon');
      timeEl.textContent=i===0
        ?weatherLabel(w.code)
        :new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit'}).format(new Date(w.time.replace(' ','T')+'+08:00')).toUpperCase();
      if(i===0) timeEl.classList.add('weather-condition');
      iconEl.innerHTML=weatherIcon(w.code,!!w.isDay);
      iconEl.classList.remove('weather-loading');
    });
  }catch(err){
    console.warn('Urbiztondo weather unavailable:',err);
    root.querySelectorAll('.weather-time').forEach((el,i)=>{el.textContent=i===0?'WEATHER':'—';});
    root.querySelectorAll('.weather-icon').forEach(el=>{el.classList.remove('weather-loading');el.textContent='—';});
  }
}
setInterval(loadSanJuanWeather,15*60*1000);
loadSanJuanWeather();

function startLocationWatch(){
  if(!navigator.geolocation || locationWatchId!==null) return;
  locationWatchId=navigator.geolocation.watchPosition(pos=>{
    const next={lat:pos.coords.latitude,lon:pos.coords.longitude};
    userPos=next;
    locationError="";

    // Keep existing brand-card DOM intact while GPS updates. Rebuilding the
    // cards repeatedly makes mobile browsers repaint/reload cover photos.
    if(currentPage==="category" || currentPage==="nearby"){
      document.querySelectorAll(".brand-card[data-brand-id]").forEach(card=>{
        const p=DATA.brands.find(x=>x.id===card.getAttribute("data-brand-id"));
        const el=card.querySelector(".distance");
        if(p && el) el.textContent=distanceLabel(p);
      });
    }else{
      redrawAfterLocation();
    }
  },err=>{
    locationError=locationErrorText(err);
    redrawAfterLocation();
  },{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
startLocationWatch();

<script id="lu-control-delegation-v158">
(function(){
  if(window.__luControlDelegationV158)return;
  window.__luControlDelegationV158=true;

  document.addEventListener("click",function(e){
    var el=e.target && e.target.closest ? e.target.closest("button,a") : null;
    if(!el)return;

    // Do not interfere with real links (Maps, Instagram, tel:, etc.).
    if(el.tagName==="A" && el.getAttribute("href")) return;

    var onclick=el.getAttribute("onclick")||"";
    if(onclick)return; // browser should execute inline handlers normally

    var tab=el.getAttribute("data-tab-page");
    if(tab==="home" && typeof window.goHome==="function"){window.goHome();return;}
    if(tab==="transport" && typeof window.showPage==="function"){window.showPage("transport");return;}
    if(tab==="nearby" && typeof window.showPage==="function"){window.showPage("nearby");return;}
    if(tab==="emergency" && typeof window.showPage==="function"){window.showPage("emergency");return;}

    var card=el.closest(".brand-card");
    if(card){
      var id=card.getAttribute("data-brand-id");
      if(id && typeof window.brandDetail==="function"){
        e.preventDefault();
        window.brandDetail(id,false);
      }
    }
  },false);
})();
</script>
<script id="lu-brand-interaction-v160">
(function(){
  if(window.__luBrandInteractionV160)return;
  window.__luBrandInteractionV160=true;

  // Brand cards use one delegated handler so the entire card is tappable.
  // This avoids relying on generated inline handlers and keeps child elements
  // such as the status banner/image from affecting navigation.
  document.addEventListener("click",function(e){
    var card=e.target && e.target.closest ? e.target.closest(".brand-card[data-brand-id]") : null;
    if(!card)return;
    var id=card.getAttribute("data-brand-id");
    if(!id)return;
    if(e.defaultPrevented)return;
    e.preventDefault();
    e.stopPropagation();
    if(typeof window.brandDetail==="function") window.brandDetail(id,false);
  },true);

  document.addEventListener("keydown",function(e){
    if(e.key!=="Enter" && e.key!==" ")return;
    var card=e.target && e.target.closest ? e.target.closest(".brand-card[data-brand-id]") : null;
    if(!card)return;
    e.preventDefault();
    var id=card.getAttribute("data-brand-id");
    if(id && typeof window.brandDetail==="function") window.brandDetail(id,false);
  });

  var style=document.createElement("style");
  style.id="lu-brand-interaction-style-v160";

</script>
