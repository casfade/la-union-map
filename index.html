<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050807"><title>La Union Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{--bg:#050807;--panel:#0d1110;--panel2:#141a18;--text:#f6f4ed;--muted:#9aa6a2;--line:#252d2a;--green:#78d6b4;--yellow:#f0c95b;--pink:#ef7f9f;--blue:#78b8e8;--orange:#ee9b61;--purple:#b497e8}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(5,8,7,.9);backdrop-filter:blur(16px);padding:16px 16px 9px;border-bottom:1px solid #121715}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-family:"Sycopate", "Arial Black", sans-serif;font-size:20px;font-weight:700;letter-spacing:-.045em;text-align:center;flex:1}.top{min-height:42px}.headsearch{border:0;background:none;color:white;font-size:31px;line-height:1;width:44px;height:44px;padding:0}.locbtn{border:0;background:none;color:white;width:48px;height:48px;font-size:31px;line-height:1}.location{text-align:center;font-size:10px;color:var(--muted);margin-top:2px}
.panel{display:none}.panel.active{display:block}.content{padding-bottom:90px}
.storyrow{display:flex;justify-content:space-evenly;gap:0;overflow:hidden;padding:15px 0 13px;width:100%}.story{width:auto;flex:1;max-width:78px;border:0;background:none;text-align:center;font-size:9px;color:#c8d0cd;padding:0}.storyring{width:62px;height:62px;border-radius:50%;padding:2px;margin:0 auto 6px;background:#fff}.storyinner{width:100%;height:100%;border-radius:50%;background:#050807;border:2px solid #050807;display:grid;place-items:center;font-size:29px;filter:grayscale(1)}
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{aspect-ratio:1/1;background:#151b18;position:relative;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover}.tile .fallback{width:100%;height:100%;display:grid;place-items:end start;padding:9px;background:linear-gradient(145deg,#153e3a,#1b2522 48%,#7b5844);font-weight:800;font-size:11px}.tile:nth-child(3n+2) .fallback{background:linear-gradient(145deg,#382f25,#765f42,#183d38)}.tile:nth-child(3n) .fallback{background:linear-gradient(145deg,#192f38,#365b61,#47352f)}.tile .badge{position:absolute;right:7px;top:7px;font-size:12px}
.section{padding:15px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.sectionhead b{font-size:15px}.small{font-size:11px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}.cardmain{display:flex;gap:11px}.thumb{width:66px;height:66px;border-radius:12px;flex:none;overflow:hidden;background:linear-gradient(135deg,#1d4841,#6d5a3e)}.thumb img{width:100%;height:100%;object-fit:cover}.cardbody{min-width:0;flex:1}.name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:10px;color:var(--muted);margin-top:2px}.status{font-size:11px;margin-top:7px}.open{color:#fff}.closed{color:#8c9692}.stats{display:flex;gap:10px;color:var(--muted);font-size:10px;margin-top:7px}.stats b{color:white}.go{border:0;background:#eef5f1;color:#08100d;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:800}.ig{border:0;background:#202823;color:#fff;border-radius:10px;padding:8px 10px;font-size:11px}.actions{display:flex;gap:7px;margin-top:10px}
.chips{display:flex;gap:8px;overflow:auto;padding:0 15px 5px}.chip{border:1px solid var(--line);background:#101512;color:#bfc8c4;border-radius:999px;padding:7px 10px;font-size:11px;white-space:nowrap}.chip.active{background:#eef5f1;color:#08100d;border-color:#eef5f1}
.mapbox{display:none}#realMap{height:430px;margin:0 0 10px;background:#18211f;border-bottom:1px solid var(--line)}.mapbottom{padding:0 15px}.route{background:#101613;border:1px solid var(--line);border-radius:15px;padding:13px}.route b{font-size:13px}.route small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.history{padding:15px}.historyitem{padding:12px 0;border-bottom:1px solid var(--line)}.historyitem b{font-size:14px}.historyitem small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.detail{padding:15px 15px 100px}.back{border:0;background:none;color:var(--muted);padding:0 0 14px}.detailphoto{height:300px;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#193e39,#755b42)}.detailphoto img{width:100%;height:100%;object-fit:cover}.detail h1{font-size:27px;margin:14px 0 3px;letter-spacing:-.04em}.detail .handle{font-size:12px}.info{margin-top:15px;border:1px solid var(--line);border-radius:16px;padding:13px;background:var(--panel)}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border:0}.row span{color:var(--muted)}.detailactions{display:flex;gap:8px;margin-top:12px}.wide{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800}.darkbtn{background:#eef5f1;color:#08100d}.greenbtn{background:#16362e;color:var(--green)}
.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}
nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 24px));background:rgba(18,22,20,.96);backdrop-filter:blur(18px);border:1px solid #303733;border-radius:24px;display:flex;justify-content:space-around;padding:11px 5px calc(11px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 12px 35px #0009}nav button{border:0;background:none;color:#7f8985;font-size:10px;padding:3px 18px}nav button span{display:block;font-size:25px;line-height:25px;margin-bottom:3px;color:inherit}nav button.active{color:white}
@media(min-width:700px){body{padding:20px 0}.app{border-radius:25px;overflow:hidden;box-shadow:0 20px 80px #000}}
</style>
<style>@font-face{font-family:"Sycopate";src:local("Sycopate"),local("Sycopate Bold")}button{-webkit-tap-highlight-color:transparent} </style></head>
<body>
<div class="app">
<header>
 <div class="top"><button class="headsearch" onclick="show('searchPanel')" aria-label="Search">⌕</button><div class="logo">La Union Map</div><button class="locbtn" onclick="locate()" title="Locate me">⌖</button></div>
 <div class="location" id="locationText">San Juan, La Union</div>
</header>

<div id="discover" class="panel active content">
 <div class="storyrow" id="stories"></div>
 <div class="section"><div class="sectionhead"><b>Hand-picked Brands</b><span class="small" id="openCount"></span></div></div>
 <div class="feed" id="feed"></div>
 <div class="section"><div class="sectionhead"><b>Open Near You</b><span class="small">live from hours</span></div><div class="cards" id="nearby"></div></div>
</div>

<div id="searchPanel" class="panel content">
 <div class="section" style="padding-bottom:7px"><div class="searchbar" style="margin-top:0"><span class="searchicon">⌕</span><input id="search" placeholder="Search La Union" oninput="render()"></div></div>
 <div class="chips" id="chips"></div><div class="section"><div class="sectionhead"><b>Places</b><span class="small" id="resultCount"></span></div><div class="cards" id="results"></div></div>
 <div class="section"><div class="sectionhead"><b>Open Near You</b><span class="small">live from hours</span></div><div class="cards" id="searchNearby"></div></div>
</div>

<div id="mapPanel" class="panel content">
 <div class="mapbox"><span class="maplabel">SAN JUAN · LA UNION</span><span class="you"></span><span class="pin p1"></span><span class="pin p2"></span><span class="pin p3"></span><span class="pin p4"></span><span class="pin p5"></span></div>
 <div class="mapbottom"><div class="route" id="route"></div><div class="section" style="padding:15px 0"><div class="sectionhead"><b>Map Places</b></div><div class="cards" id="mapCards"></div></div><div class="section" style="padding-top:0"><div class="sectionhead"><b>Open Near You</b><span class="small">live from hours</span></div><div class="cards" id="mapNearby"></div></div></div>
</div>

<div id="historyPanel" class="panel content"><div class="history"><div class="sectionhead"><b>Your history</b></div><div id="historyList"></div></div></div>

<div id="detailPanel" class="panel content"><div class="detail"><button class="back" onclick="show('discover')">← Back</button><div id="detailBody"></div></div></div>

<nav>
 <button class="active" data-p="discover" onclick="show('discover')"><span>⌂</span>Home</button>
 <button data-p="searchPanel" onclick="show('searchPanel')"><span>⌕</span>Search</button>
 <button data-p="mapPanel" onclick="show('mapPanel')"><span>⌖</span>Map</button>
 <button data-p="historyPanel" onclick="show('historyPanel')"><span>♡</span>History</button>
</nav>
</div>

<script>

const raw=[
["Irugi Coffee","Cafe","₱","irugicoffee","8:00 AM – 4:00 PM","https://www.instagram.com/irugicoffee/","Brgy, Arbor Village, Maria Cristina, San Juan, La Union"],
["Ili Coffee","Cafe","₱","ilicoffee","8:00 AM – 5:00 PM","https://www.instagram.com/","Avecilla St., Ili Sur, San Juan, La Union"],
["Masa Bakehouse","Cafe","₱","masabybarefoot","8:00 AM – 6:00 PM","https://www.instagram.com/masabybarefoot/","Costales St., Sitio Dappat, Ili Norte, San Juan"],
["Mama Pizza","Food","₱₱","mamapizzalu","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Bubbas Pizza","Food","₱₱","bubbaspizza","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Peppercorn Bar","Bar","₱₱₱","peppercornbar","4:00 PM – 12:00 AM","https://www.instagram.com/","Station Lane, Maria Cristina, San Juan"],
["Nanumo Poke Club","Food","₱₱","nanumopokeclub","11:00 AM – 7:00 PM","https://www.instagram.com/","Station Lane, Arbor Village, Maria Cristina"],
["Makan at Eliseos","Food","₱₱₱","makan.at.eliseos","8:00 AM – 9:00 PM","https://www.instagram.com/makan.at.eliseos/","379 Saint Jude Subdivision, San Juan"],
["Taaw Beach Club","Activity","₱₱₱","taawbeachclub.official","11:00 AM – 8:00 PM","https://www.instagram.com/taawbeachclub.official/","380 Saint Jude Subdivision, San Juan"],
["NakNak Eatery","Food","₱","naknakeatery","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Sabong Fried Chicken","Food","₱","sabongfc","11:00 AM – 9:00 PM","https://www.instagram.com/sabongfc/","National Highway, Urbiztondo, San Juan"],
["Fotomatk","Activity","₱₱","fotomatk","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Bitbit / Bitpic","Activity","₱₱","bitbit","9:00 AM – 9:00 PM","https://www.instagram.com/","Great Northwest, Urbiztondo, San Juan"],
["El Union Coffee","Cafe","₱₱","elunion","7:00 AM – 9:00 PM","https://www.instagram.com/elunion/","MacArthur National Highway, San Juan"],
["Funky Quarters","Bar","₱₱","funkyquarters","Hours vary","https://www.instagram.com/","Urbiztondo, San Juan"],
["Mad Monkeys","Food","₱₱","madmonkeys","11:00 AM – 8:00 PM","https://www.instagram.com/","Urbiztondo, San Juan"],
["Tasting Room","Bar","₱₱₱","tastingroomlu","7:00 PM – 2:00 AM","https://www.instagram.com/","Plaza de Castiel, San Juan"],
["Ugly Bar","Bar","₱₱","uglybarlu","10:00 AM – 3:00 AM","https://www.instagram.com/","Urbiztondo Rd., San Juan"],
["Kermit La Union","Food","₱₱₱","kermitlaunion","11:00 AM – 10:00 PM","https://www.instagram.com/kermitlaunion/","Great Northwest, Urbiztondo, San Juan"],
["Katzenjama","Food","₱₱","katzenjama","Hours vary","https://www.instagram.com/","San Fernando / La Union"],
["Flotsam and Jetsam","Activity","₱₱₱","flotsamandjetsam","Hours vary","https://www.instagram.com/flotsamandjetsamhostel/","MacArthur Highway, Urbiztondo, San Juan"],
["Little Canggu","Food","₱₱","littlecanggu","8:00 AM – 8:00 PM","https://www.instagram.com/","MacArthur Hwy, Urbiztondo, San Juan"],
["Soms Thai","Food","₱₱","somsthai","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Kuya M's","Food","₱₱","kuyams","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Totos Flamegrilled Bad Decisions","Food","₱₱","totosflamegrilled","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Kahel","Activity","₱₱₱","kahelresort","Hours vary","https://www.instagram.com/","Calle de Riles, San Juan"],
["Curo","Cafe","₱₱","curo","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Chus Diner","Food","₱₱","chusdiner","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Fin and Folk","Food","₱₱₱","finandfolk","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Miryinda","Food","₱₱","miryinda","Hours vary","https://www.instagram.com/","225 Urbiztondo, San Juan"],
["July Grocery","Food","₱","julygrocery","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Karruba","Food","₱₱","karruba","Hours vary","https://www.instagram.com/","San Juan, La Union"],
["Halu Ice Cream","Dessert","₱","haluicecream","Hours vary","https://www.instagram.com/","San Juan, La Union"]
];
let places=raw.map((x,i)=>({id:i,name:x[0],category:x[1],price:x[2],handle:x[3],hours:x[4],ig:x[5],address:x[6]}));
const coords={
"Irugi Coffee":[16.67255,120.32185],
"Ili Coffee":[16.66880,120.31965],
"Masa Bakehouse":[16.67138,120.32116],
"Peppercorn Bar":[16.67032,120.32123],
"Nanumo Poke Club":[16.67012,120.32102],
"Makan at Eliseos":[16.67152,120.32167],
"Taaw Beach Club":[16.67157,120.32184],
"Sabong Fried Chicken":[16.67106,120.32025],
"El Union Coffee":[16.66920,120.31955],
"Tasting Room":[16.66970,120.32022],
"Ugly Bar":[16.66900,120.31910],
"Kermit La Union":[16.66972,120.31858],
"Flotsam and Jetsam":[16.66995,120.31878],
"Little Canggu":[16.66954,120.31836],
"Miryinda":[16.66933,120.31898],
"Kahel":[16.67095,120.32162]
};
places.forEach(p=>{if(coords[p.name]){p.lat=coords[p.name][0];p.lng=coords[p.name][1]}});

let map=null, mapMarkers=[], userMarker=null, userAccuracy=null;
function initMap(){
 if(map)return;
 map=L.map("realMap",{zoomControl:false}).setView([16.6697,120.3198],15);
 L.control.zoom({position:"bottomright"}).addTo(map);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
   maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
 }).addTo(map);
 map.on("locationfound",e=>updateUserLocation(e.latlng.lat,e.latlng.lng,e.accuracy));
 renderMarkers();
 setTimeout(()=>map.invalidateSize(),200);
}
function markerIcon(color="#ef7f9f"){
 return L.divIcon({className:"",html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 2px 10px #0007"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
}
function renderMarkers(){
 if(!map)return;
 mapMarkers.forEach(m=>m.remove());mapMarkers=[];
 places.filter(p=>p.lat&&p.lng).forEach(p=>{
   let color=({Food:"#ef7f9f",Cafe:"#78b8e8",Cocktails:"#b497e8",Bar:"#f0c95b",Dessert:"#ee9b61",Activity:"#78d6b4"}[p.category]||"#fff");
   let m=L.marker([p.lat,p.lng],{icon:markerIcon(color)}).addTo(map);
   m.bindPopup(`<b>${esc(p.name)}</b><br><span style="font-size:11px">${esc(p.category)} · ${esc(p.price)}</span><br><button onclick="detail('${p.id}')" style="margin-top:7px">View</button>`);
   mapMarkers.push(m);
 });
}
function updateUserLocation(lat,lng,accuracy){
 userPos={lat,lng};
 if(userMarker)userMarker.remove();
 if(userAccuracy)userAccuracy.remove();
 userMarker=L.marker([lat,lng],{icon:markerIcon("#78b8e8")}).addTo(map).bindPopup("<b>You are here</b>");
 userAccuracy=L.circle([lat,lng],{radius:accuracy||30,color:"#78b8e8",fillColor:"#78b8e8",fillOpacity:.08,weight:1}).addTo(map);
 document.getElementById("locationText").textContent="Your location · GPS ready";
 render();
 renderMap();
}


let userPos=null,filter="All";
const cats=["All","Food","Cafe","Bar","Dessert","Activity"];
const icons={All:"✦",Food:"⌁",Cafe:"◉",Bar:"◒",Dessert:"○",Activity:"⌁"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fallback(p){return `<div class="fallback"><span>${icons[p.category]||"✦"} ${esc(p.name)}</span></div>`}
function photo(p,cls=""){return p.photo?`<img class="${cls}" src="${esc(p.photo)}" alt="">`:fallback(p)}
function show(id){
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.p===id));
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 if(id==="discover")document.getElementById("discoverTab").classList.add("active");
 if(id==="searchPanel")document.getElementById("searchTab").classList.add("active");
 if(id==="mapPanel"){initMap();renderMap()} if(id==="historyPanel")renderHistory();window.scrollTo(0,0)
}
function story(){document.getElementById("stories").innerHTML=cats.filter(x=>x!=="All").map(c=>`<button class="story" onclick="filter='${c}';show('searchPanel');render()"><div class="storyring" style="background:conic-gradient(${({Food:"#ef7f9f",Cafe:"#78b8e8",Bar:"#f0c95b",Dessert:"#ee9b61",Activity:"#78d6b4"}[c])},#fff,${({Food:"#ef7f9f",Cafe:"#78b8e8",Bar:"#f0c95b",Dessert:"#ee9b61",Activity:"#78d6b4"}[c])})"><div class="storyinner">${icons[c]}</div></div>${c}</button>`).join("")}
function isOpen(p){let s=p.hours.toLowerCase();if(s.includes("vary"))return null;let m=s.match(/(\d{1,2}):?(\d{2})?\s*(am|pm)\s*[–-]\s*(\d{1,2}):?(\d{2})?\s*(am|pm)/i);if(!m)return null;function n(h,mi,ap){h=+h;mi=+(mi||0);if(ap.toLowerCase()==="pm"&&h<12)h+=12;if(ap.toLowerCase()==="am"&&h===12)h=0;return h*60+mi}let a=n(m[1],m[2],m[3]),b=n(m[4],m[5],m[6]),now=new Date(),cur=now.getHours()*60+now.getMinutes();if(b<=a)return cur>=a||cur<b;return cur>=a&&cur<b}
function status(p){let o=isOpen(p);if(o===true)return "OPEN NOW";if(o===false)return "CLOSED";return "HOURS VERIFY"}
function dist(p){
 if(!userPos||!p.lat||!p.lng)return null;
 const R=6371,dLat=(p.lat-userPos.lat)*Math.PI/180,dLon=(p.lng-userPos.lng)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+Math.cos(userPos.lat*Math.PI/180)*Math.cos(p.lat*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function card(p){return `<div class="card"><div class="cardmain"><div class="thumb">${photo(p)}</div><div class="cardbody"><div class="name">${esc(p.name)}</div><div class="handle">@${esc(p.handle)}</div><div class="status ${isOpen(p)===true?"open":"closed"}">${status(p)}${p.hours.includes("vary")?"":` · ${esc(p.hours)}`}</div><div class="stats"><span>${esc(p.category)}</span><span>•</span><b>${esc(p.price)}</b></div></div></div><div class="actions"><button class="go" onclick="go('${p.id}')">GO ↗</button><button class="ig" onclick="instagram('${p.id}')">Instagram</button><button class="ig" onclick="detail('${p.id}')">View</button></div></div>`}
function render(){
 story();let q=document.getElementById("search")?.value.toLowerCase()||"";let arr=places.filter(p=>(filter==="All"||p.category===filter)&&(`${p.name} ${p.category} ${p.handle}`).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById("resultCount").textContent=arr.length+" places";document.getElementById("results").innerHTML=arr.length?arr.map(card).join(""):`<div class="empty">Nothing found.</div>`;let openSorted=[...places].filter(p=>isOpen(p)===true).sort((a,b)=>a.name.localeCompare(b.name));document.getElementById("searchNearby").innerHTML=(openSorted.length?openSorted:[...places].sort((a,b)=>a.name.localeCompare(b.name))).slice(0,8).map(card).join("");
 document.getElementById("feed").innerHTML=places.slice(0,18).map(p=>`<button class="tile" onclick="detail('${p.id}')">${photo(p)}<span class="badge">♡</span></button>`).join("");
 let sorted=[...places].sort((a,b)=>a.name.localeCompare(b.name));let open=sorted.filter(p=>isOpen(p)===true);document.getElementById("openCount").textContent=open.length+" open now";document.getElementById("nearby").innerHTML=(open.length?open:sorted).slice(0,8).map(card).join("");
}
function chips(){document.getElementById("chips").innerHTML=cats.map(c=>`<button class="chip ${filter===c?"active":""}" onclick="filter='${c}';render()">${icons[c]} ${c}</button>`).join("")}
function instagram(id){let p=places.find(x=>x.id==id);window.open(p.ig,"_blank")}
function go(id){let p=places.find(x=>x.id==id);historyAdd(p);window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+" "+p.address+" La Union")}`,"_blank")}
function detail(id){let p=places.find(x=>x.id==id);show("detailPanel");document.getElementById("detailBody").innerHTML=`<div class="detailphoto">${photo(p)}</div><h1>${esc(p.name)}</h1><div class="handle">@${esc(p.handle)}</div><div class="status ${isOpen(p)===true?"open":"closed"}" style="margin-top:9px">${status(p)} · ${esc(p.hours)}</div><div class="info"><div class="row"><span>Category</span><b>${esc(p.category)}</b></div><div class="row"><span>Price</span><b>${esc(p.price)}</b></div><div class="row"><span>Address</span><b style="max-width:60%;text-align:right">${esc(p.address)}</b></div><div class="row"><span>Instagram</span><b>@${esc(p.handle)}</b></div></div><div class="detailactions"><button class="wide darkbtn" onclick="go('${p.id}')">GO WITH GOOGLE MAPS ↗</button><button class="wide greenbtn" onclick="instagram('${p.id}')">INSTAGRAM</button></div>`}
function historyAdd(p){let h=JSON.parse(localStorage.getItem("lu_history")||"[]");h.unshift({name:p.name,time:new Date().toISOString()});localStorage.setItem("lu_history",JSON.stringify(h.slice(0,40)))}
function renderHistory(){let h=JSON.parse(localStorage.getItem("lu_history")||"[]");document.getElementById("historyList").innerHTML=h.length?h.map(x=>`<div class="historyitem"><b>${esc(x.name)}</b><small>${new Date(x.time).toLocaleString()}</small></div>`).join(""):`<div class="empty">Places you navigate to will appear here.</div>`}
function renderMap(){document.getElementById("route").innerHTML=`<b>Google Maps navigation</b><small>Tap GO on a place for live routing, traffic and turn-by-turn directions. This MVP deliberately hands navigation to Google Maps instead of trying to recreate it.</small>`;document.getElementById("mapCards").innerHTML=[...places].sort((a,b)=>a.name.localeCompare(b.name)).slice(0,10).map(card).join("");let mo=[...places].filter(p=>isOpen(p)===true).sort((a,b)=>a.name.localeCompare(b.name));document.getElementById("mapNearby").innerHTML=(mo.length?mo:[...places].sort((a,b)=>a.name.localeCompare(b.name))).slice(0,8).map(card).join("")}
function locate(){
 if(!navigator.geolocation)return alert("Location isn't supported by this browser.");
 document.getElementById("locationText").textContent="Finding your location…";
 navigator.geolocation.getCurrentPosition(p=>{
   updateUserLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
   if(map){map.setView([p.coords.latitude,p.coords.longitude],15)}
 },()=>document.getElementById("locationText").textContent="Location permission unavailable",{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}
chips();render();
</script>
</body></html>
