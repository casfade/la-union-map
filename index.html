function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function currentDay(){return new Date().getDay();}
function dayNum(name){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(name);}
function dayMatches(token,d){token=token.trim();if(!token)return false;const parts=token.split(/[–-]/);if(parts.length===2){const a=dayNum(parts[0].trim().slice(0,3)),b=dayNum(parts[1].trim().slice(0,3));if(a<0||b<0)return false;return a<=b?d>=a&&d<=b:d>=a||d<=b;}return dayNum(token.slice(0,3))===d;}
function currentSchedule(p){const s=p.schedule||'Days not listed',d=currentDay();if(s.startsWith('Daily '))return s.slice(6);for(const bit of s.split(' · ')){const match=bit.match(/^(.+?)\s+(\d{1,2}:\d{2}.*)$/);if(!match)continue;const days=match[1].trim(),time=match[2].trim();if(/closed/i.test(days)&&dayMatches(days.replace(/closed/ig,'').trim(),d))return 'Closed';if(dayMatches(days.replace(/closed/ig,'').trim(),d))return time;}return s==='Days not listed'?'Hours not listed':s;}
function isOpen(p){const s=currentSchedule(p);if(s==='Hours not listed')return null;if(/^closed$/i.test(s))return false;const m=s.match(/(\d{1,2}:\d{2})\s*([AP]M).*?(\d{1,2}:\d{2})\s*([AP]M)/i);if(!m)return null;const cv=(t,a)=>((+t.split(':')[0]%12)+(a.toUpperCase()==='PM'?12:0))*60+ +t.split(':')[1];const n=new Date(),mins=n.getHours()*60+n.getMinutes(),a=cv(m[1],m[2]),b=cv(m[3],m[4]);return b>=a?mins>=a&&mins<=b:mins>=a||mins<=b;}
function distance(p){
 if(!userPos||!Array.isArray(p.coords)||p.coords.length<2)return null;
 const lat=Number(p.coords[0]),lon=Number(p.coords[1]);
 if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;
 const R=6371,dLat=(lat-userPos[0])*Math.PI/180,dLon=(lon-userPos[1])*Math.PI/180;
 const a=Math.sin(dLat/2)**2+Math.cos(userPos[0]*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;
 return Number.isFinite(a)?R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)):null;
}

 class="cards nearby" style="padding:0">${sug.length?sug.map(card).join(''):'<div class="empty">No nearby mapped brands yet.</div>'}</div></div>`}function renderPhotos(p){const a=(p.photos||[]).filter(Boolean);if(!a.length)return '<div class="hero-placeholder"><span>Recent photos</span><small>1080 × 1080</small></div>';return '<div class="photo-track">'+a.map((u,i)=>`<img src="${esc(u)}" alt="${esc(p.name)} photo ${i+1}">`).join('')+'</div><div class="photo-dots">'+a.map((_,i)=>`<span class="${i?'':'active'}"></span>`).join('')+'</div>'}
function geoDistance(a,b){
 if(!a||!b)return null;
 const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function nearbyCards(current){
 if(!current.coords)return [];
 return places
   .filter(p=>p.id!==current.id&&p.coords)
   .map(p=>({p,d:geoDistance(current.coords,p.coords)}))
   .sort((a,b)=>(a.d-b.d)||a.p.name.localeCompare(b.p.name))
   .slice(0,4)
   .map(x=>x.p);
}

function requestLocation(){
 locationStatus="locating";updateLocationUI();
 if(!navigator.geolocation){locationStatus="unsupported";updateLocationUI();return;}
 if(window.locationWatchId)navigator.geolocation.clearWatch(window.locationWatchId);
 window.locationWatchId=navigator.geolocation.watchPosition(pos=>{
   userPos=[Number(pos.coords.latitude),Number(pos.coords.longitude)];
   locationStatus="ready";updateLocationUI();
   if(document.getElementById("categoryPage")?.classList.contains("active"))renderCategory();
   if(document.getElementById("detailPage")?.classList.contains("active")){
     const id=document.getElementById("detailBody")?.dataset?.brandId;
     if(id!==undefined)detail(id);
   }
 },err=>{
   locationStatus=err.code===1?"denied":err.code===2?"unavailable":"timeout";updateLocationUI();
 },{enableHighAccuracy:true,maximumAge:30000,timeout:15000});
}
function updateLocationUI(){
 const el=document.getElementById("locationStatus");if(!el)return;
 if(locationStatus==="locating")el.innerHTML='<div class="locating">📍 Locating you…</div>';

 else el.innerHTML='<button class="location-enable" onclick="requestLocation()">Enable Location</button>';
}
