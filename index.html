<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5EEDC">
<title>La Union Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{
 --bg:#F5EEDC;--paper:#FFFDF6;--ink:#273735;--muted:#7E8178;--line:#DED6C5;
 --food:#e36888;--drinks:#f08c21;--bar:#f2d88f;--dessert:#6698cc;--activity:#b4b534;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eee8d8}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:540px;min-height:100vh;margin:auto;background:var(--bg);position:relative}
.landing{min-height:100vh;padding:58px 24px 42px;display:flex;flex-direction:column;justify-content:center}
.landing h1{font-size:27px;letter-spacing:-.04em;margin:0 0 28px;font-weight:800}
.category-list{display:flex;flex-direction:column;gap:13px}
.category{
 border:0;border-radius:18px;padding:21px 20px;text-align:left;font-size:19px;
 font-weight:850;letter-spacing:-.02em;color:#273735;box-shadow:0 5px 18px rgba(39,55,53,.08);
 transition:transform .12s ease;
}
.category:active{transform:scale(.98)}
.food{background:var(--food)}.drinks{background:var(--drinks)}.bar{background:var(--bar)}
.dessert{background:var(--dessert)}.activity{background:var(--activity)}
.near{background:var(--ink);color:#fff}
.page{display:none;min-height:100vh;padding-bottom:30px}.page.active{display:block}
.page-top{
 position:sticky;top:0;z-index:50;background:rgba(245,238,220,.97);backdrop-filter:blur(12px);
 padding:12px 15px;border-bottom:1px solid var(--line)
}
.back{
 display:inline-flex;align-items:center;border:0;background:var(--paper);color:var(--ink);
 border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-height:44px;font-size:15px;font-weight:800;
 box-shadow:0 4px 14px rgba(39,55,53,.07)
}
.page-title{padding:17px 15px 8px;font-size:24px;font-weight:850;letter-spacing:-.04em}
.searchbar{margin:0 15px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.searchbar input{width:100%;border:0;background:none;outline:0;color:var(--ink)}
.chips{display:flex;gap:8px;overflow:auto;padding:0 15px 9px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px;font-size:11px;white-space:nowrap;color:var(--ink)}
.chip.active{background:var(--ink);color:white;border-color:var(--ink)}
.cards{padding:0 15px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:12px}
.cardmain{display:flex;gap:12px}.thumb{width:82px;height:82px;border-radius:13px;overflow:hidden;flex:none;background:#d7cdb9}
.thumb img{width:100%;height:100%;object-fit:cover}
.fallback{width:100%;height:100%;display:flex;align-items:flex-end;padding:9px;background:linear-gradient(145deg,#dfc9aa,#a4b4a0);font-size:11px;font-weight:800}
.cardbody{min-width:0;flex:1}.name{font-size:16px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{font-size:10px;color:var(--muted);margin-top:2px}.status{font-size:11px;font-weight:750;margin-top:8px}
.open{color:#477e63}.closed{color:#a35a63}.verify{color:#8b7651}
.stats{display:flex;gap:10px;font-size:10px;color:var(--muted);margin-top:7px}.stats b{color:var(--ink)}
.actions{display:flex;gap:7px;margin-top:10px}
.btn{border:0;border-radius:11px;padding:10px 7px;font-size:11px;font-weight:800;min-height:40px;flex:1;line-height:1.15}
.go{background:var(--ink);color:white}.ig{background:#eadfca;color:var(--ink)}.view{background:#e1eadf;color:var(--ink)}
.section-label{padding:17px 15px 8px;font-size:16px;font-weight:850}
.section-label small{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:3px}
.nearest-wrap{padding:0 15px}
.nearest-wrap .card{margin-bottom:10px}
.detail-actions{display:flex;gap:8px;margin-top:12px}
.detail-actions .wide{min-height:44px}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 2px}
.tile{border:0;padding:0;aspect-ratio:1;background:#d9cfbd;overflow:hidden;position:relative}
.tile img{width:100%;height:100%;object-fit:cover}.tile .fallback{font-size:10px}
.tile-label{position:absolute;left:7px;bottom:7px;color:white;text-shadow:0 1px 5px #000;font-size:10px;font-weight:800}
.map-wrap{padding:0 0 10px}
#realMap{height:430px;width:100%;background:#ddd6c7}
.map-note{margin:0 15px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:12px;font-size:11px}
.map-note b{font-size:13px}.map-note small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}
.detail-photo{height:330px;background:#d7cdb9;overflow:hidden}.detail-photo img{width:100%;height:100%;object-fit:cover}
.detail{padding:0 15px 35px}.detail h1{font-size:29px;letter-spacing:-.05em;margin:16px 0 2px}.detail .handle{font-size:12px}
.info{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:12px}
.row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border:0}.row span{color:var(--muted)}
.wide{flex:1;padding:12px;border:0;border-radius:13px;font-weight:850}.dark{background:var(--ink);color:white}.light{background:#e1eadf;color:var(--ink)}
.subsection{padding:18px 15px 8px;font-size:16px;font-weight:850}.nearby .card{padding:10px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:45px 20px}
.history{padding:0 15px}.historyitem{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}.historyitem b{font-size:13px}.historyitem small{display:block;color:var(--muted);margin-top:3px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--paper);color:var(--ink)}
.leaflet-popup-content{font-family:inherit;font-size:12px}
@media(min-width:700px){body{padding:20px 0}.app{border-radius:28px;overflow:hidden;box-shadow:0 20px 70px rgba(39,55,53,.14)}}
</style>
</head>
<body>
<div class="app">

<!-- LANDING -->
<section id="landing" class="page active landing">
  <h1>Where do you want to go?</h1>
  <div class="category-list">
    <button class="category food" onclick="openCategory('Food')">Food</button>
    <button class="category drinks" onclick="openCategory('Drinks')">Drinks</button>
    <button class="category bar" onclick="openCategory('Bar')">Bar</button>
    <button class="category dessert" onclick="openCategory('Dessert')">Dessert</button>
    <button class="category activity" onclick="openCategory('Activities')">Activities</button>
    <button class="category near" onclick="openCategory('Near My Current Location')">Near My Current Location</button>
  </div>
</section>

<!-- CATEGORY -->
<section id="categoryPage" class="page">
  <div class="page-top"><button class="back" onclick="backHome()">← Back</button></div>
  <div class="page-title" id="categoryTitle"></div>
  <div class="searchbar"><input id="categorySearch" placeholder="Search places…" oninput="renderCategory()"></div>
  <div class="cards" id="categoryCards"></div>
</section>

<!-- DETAIL -->
<section id="detailPage" class="page">
  <div class="page-top"><button class="back" onclick="backToCategory()">← Back</button></div>
  <div id="detailBody"></div>
</section>

<!-- MAP -->
<section id="mapPage" class="page">
  <div class="page-top"><button class="back" onclick="backToCategory()">← Back</button></div>
  <div class="page-title">Map</div>
  <div class="map-wrap"><div id="realMap"></div></div>
  <div class="map-note" id="mapNote"></div>
</section>

<!-- HISTORY -->
<section id="historyPage" class="page">
  <div class="page-top"><button class="back" onclick="backHome()">← Back</button></div>
  <div class="page-title">History</div>
  <div class="history" id="historyList"></div>
</section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const raw=[
["Irugi Coffee","Drinks","₱","irugicoffee","8:00 AM – 4:00 PM","https://www.instagram.com/irugicoffee/","Brgy, Arbor Village, Maria Cristina, San Juan, La Union",[16.67255,120.32185]],
["Ili Coffee","Drinks","₱","ilicoffee","8:00 AM – 5:00 PM","https://www.instagram.com/","Avecilla St., Ili Sur, San Juan, La Union",[16.66880,120.31965]],
["Masa Bakehouse","Drinks","₱","masabybarefoot","8:00 AM – 6:00 PM","https://www.instagram.com/masabybarefoot/","Costales St., Sitio Dappat, Ili Norte, San Juan",[16.67138,120.32116]],
["Mama Pizza","Food","₱₱","mamapizzalu","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Bubbas Pizza","Food","₱₱","bubbaspizza","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Peppercorn Bar","Bar","₱₱₱","peppercornbar","4:00 PM – 12:00 AM","https://www.instagram.com/","Station Lane, Maria Cristina, San Juan",[16.67032,120.32123]],
["Nanumo Poke Club","Food","₱₱","nanumopokeclub","11:00 AM – 7:00 PM","https://www.instagram.com/","Station Lane, Arbor Village, Maria Cristina",[16.67012,120.32102]],
["Makan at Eliseos","Food","₱₱₱","makan.at.eliseos","8:00 AM – 9:00 PM","https://www.instagram.com/makan.at.eliseos/","379 Saint Jude Subdivision, San Juan",[16.67152,120.32167]],
["Taaw Beach Club","Activities","₱₱₱","taawbeachclub.official","11:00 AM – 8:00 PM","https://www.instagram.com/taawbeachclub.official/","380 Saint Jude Subdivision, San Juan",[16.67157,120.32184]],
["NakNak Eatery","Food","₱","naknakeatery","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Sabong Fried Chicken","Food","₱","sabongfc","11:00 AM – 9:00 PM","https://www.instagram.com/sabongfc/","National Highway, Urbiztondo, San Juan",[16.67106,120.32025]],
["Fotomatk","Activities","₱₱","fotomatk","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Bitbit / Bitpic","Activities","₱₱","bitbit","9:00 AM – 9:00 PM","https://www.instagram.com/","Great Northwest, Urbiztondo, San Juan",null],
["El Union Coffee","Drinks","₱₱","elunion","7:00 AM – 9:00 PM","https://www.instagram.com/elunion/","MacArthur National Highway, San Juan",[16.66920,120.31955]],
["Funky Quarters","Bar","₱₱","funkyquarters","Hours vary","https://www.instagram.com/","Urbiztondo, San Juan",null],
["Mad Monkeys","Food","₱₱","madmonkeys","11:00 AM – 8:00 PM","https://www.instagram.com/","Urbiztondo, San Juan",null],
["Tasting Room","Bar","₱₱₱","tastingroomlu","7:00 PM – 2:00 AM","https://www.instagram.com/","Plaza de Castiel, San Juan",[16.66970,120.32022]],
["Ugly Bar","Bar","₱₱","uglybarlu","10:00 AM – 3:00 AM","https://www.instagram.com/","Urbiztondo Rd., San Juan",[16.66900,120.31910]],
["Kermit La Union","Food","₱₱₱","kermitlaunion","11:00 AM – 10:00 PM","https://www.instagram.com/kermitlaunion/","Great Northwest, Urbiztondo, San Juan",[16.66972,120.31858]],
["Katzenjama","Food","₱₱","katzenjama","Hours vary","https://www.instagram.com/","San Juan / La Union",null],
["Flotsam and Jetsam","Activities","₱₱₱","flotsamandjetsam","Hours vary","https://www.instagram.com/flotsamandjetsamhostel/","MacArthur Highway, Urbiztondo, San Juan",[16.66995,120.31878]],
["Little Canggu","Food","₱₱","littlecanggu","8:00 AM – 8:00 PM","https://www.instagram.com/","MacArthur Hwy, Urbiztondo, San Juan",[16.66954,120.31836]],
["Soms Thai","Food","₱₱","somsthai","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Kuya M's","Food","₱₱","kuyams","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Totos Flamegrilled Bad Decisions","Food","₱₱","totosflamegrilled","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Kahel","Activities","₱₱₱","kahelresort","Hours vary","https://www.instagram.com/","Calle de Riles, San Juan",[16.67095,120.32162]],
["Curo","Drinks","₱₱","curo","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Chus Diner","Food","₱₱","chusdiner","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Fin and Folk","Food","₱₱₱","finandfolk","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Miryinda","Food","₱₱","miryinda","Hours vary","https://www.instagram.com/","225 Urbiztondo, San Juan",[16.66933,120.31898]],
["July Grocery","Food","₱","julygrocery","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Karruba","Food","₱₱","karruba","Hours vary","https://www.instagram.com/","San Juan, La Union",null],
["Halu Ice Cream","Dessert","₱","haluicecream","Hours vary","https://www.instagram.com/","San Juan, La Union",null]
];
const places=raw.map((x,i)=>({
 id:i,name:x[0],category:x[1],price:x[2],handle:x[3],hours:x[4],ig:x[5],address:x[6],coords:x[7],
 days:"Days not listed"
}));
let currentCategory="Food",userPos=null,map=null,userMarker=null,markers=[];

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function isOpen(p){
 const m=p.hours.match(/(\d{1,2}):?(\d{2})?\s*(am|pm)\s*[–-]\s*(\d{1,2}):?(\d{2})?\s*(am|pm)/i);
 if(!m)return null;
 const n=(h,mi,ap)=>{h=+h;mi=+(mi||0);if(ap.toLowerCase()=="pm"&&h<12)h+=12;if(ap.toLowerCase()=="am"&&h==12)h=0;return h*60+mi};
 const a=n(m[1],m[2],m[3]),b=n(m[4],m[5],m[6]),now=new Date(),cur=now.getHours()*60+now.getMinutes();
 return b<=a?(cur>=a||cur<b):(cur>=a&&cur<b);
}
function distance(p){
 if(!userPos||!p.coords)return null;
 const R=6371,dLat=(p.coords[0]-userPos.lat)*Math.PI/180,dLon=(p.coords[1]-userPos.lng)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+Math.cos(userPos.lat*Math.PI/180)*Math.cos(p.coords[0]*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function photo(p){
 return p.photo?`<img src="${esc(p.photo)}" alt="">`:
 `<div class="fallback">${esc(p.name)}</div>`;
}
function card(p){
 const o=isOpen(p),d=distance(p);
 const status=o===true?"OPEN NOW":o===false?"CLOSED":"HOURS VERIFY";
 return `<div class="card"><div class="cardmain"><div class="thumb">${photo(p)}</div><div class="cardbody">
 <div class="name">${esc(p.name)}</div><div class="handle">@${esc(p.handle)}</div>
 <div class="status ${o===true?"open":o===false?"closed":"verify"}">${status}</div>
 <div class="stats"><span>Hours: <b>${esc(p.hours)}</b></span></div>
 <div class="stats"><span>Days: <b>${esc(p.days)}</b></span></div>
 <div class="stats"><span>${esc(p.price)}</span><span>•</span><span>${d!==null?(d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km"):"location unavailable"}</span></div>
 </div></div><div class="actions">
 <button class="btn go" onclick="go('${p.id}')">Maps</button>
 <button class="btn ig" onclick="instagram('${p.id}')">Instagram</button>
 <button class="btn view" onclick="detail('${p.id}')">More Details</button>
 </div></div>`;
}
function setPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 window.scrollTo(0,0);
}
function backHome(){setPage("landing")}
function backToCategory(){setPage("categoryPage")}
function openCategory(cat){
 currentCategory=cat;
 document.getElementById("categoryTitle").textContent=cat;
 document.getElementById("categorySearch").value="";
 setPage("categoryPage");renderCategory();
}
function renderCategory(){
 const q=document.getElementById("categorySearch").value.toLowerCase();
 let arr=places.filter(p=>{
   const matchesCategory=currentCategory==="Near My Current Location" || p.category===currentCategory;
   return matchesCategory && (`${p.name} ${p.handle}`.toLowerCase().includes(q));
 });

 const withDistance=arr.filter(p=>distance(p)!==null);
 const nearest=withDistance.slice().sort((a,b)=>(distance(a)-distance(b)) || a.name.localeCompare(b.name)).slice(0,5);
 const alphabetical=arr.slice().sort((a,b)=>a.name.localeCompare(b.name));

 let out="";
 if(nearest.length){
   out += `<div class="section-label">Nearest to You<small>Closest places based on your current location</small></div>`;
   out += `<div class="nearest-wrap">${nearest.map(card).join("")}</div>`;
 }
 out += `<div class="section-label">${currentCategory==="Near My Current Location"?"All Places":"All "+esc(currentCategory)}</div>`;
 out += alphabetical.length ? `<div class="cards">${alphabetical.map(card).join("")}</div>` : `<div class="empty">Nothing found.</div>`;
 document.getElementById("categoryCards").innerHTML=out;
}
function detail(id){
 const p=places.find(x=>x.id==id),o=isOpen(p),d=distance(p);
 setPage("detailPage");
 const suggestions=nearbyCards(p);
 document.getElementById("detailBody").innerHTML=`<div class="detail-photo">${photo(p)}</div><div class="detail">
 <h1>${esc(p.name)}</h1><div class="handle">@${esc(p.handle)}</div>
 <div class="status ${o===true?"open":o===false?"closed":"verify"}" style="margin-top:9px">${o===true?"OPEN NOW":o===false?"CLOSED":"HOURS VERIFY"}</div>
 <div class="info">
 <div class="row"><span>Category</span><b>${esc(p.category)}</b></div>
 <div class="row"><span>Price</span><b>${esc(p.price)}</b></div>
 <div class="row"><span>Opening hours</span><b>${esc(p.hours)}</b></div>
 <div class="row"><span>Opening days</span><b>${esc(p.days)}</b></div>
 <div class="row"><span>Distance from you</span><b>${d!==null?(d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km"):"Location unavailable"}</b></div>
 <div class="row"><span>Address</span><b style="max-width:60%;text-align:right">${esc(p.address)}</b></div>
 <div class="row"><span>Promo</span><b>None listed</b></div>
 <div class="row"><span>Event</span><b>None listed</b></div>
 </div>
 <div class="detail-actions"><button class="wide dark" onclick="go('${p.id}')">Maps</button><button class="wide light" onclick="instagram('${p.id}')">Instagram</button></div>
 <div class="subsection" style="padding-left:0">More places nearby<small style="display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:3px">Other brands close to this current brand area</small></div>
 <div class="cards nearby" style="padding:0">${suggestions.length?suggestions.map(card).join(""):`<div class="empty">No nearby mapped brands yet.</div>`}</div>
 </div>`;
}
function geoDistance(a,b){
 if(!a||!b)return null;
 const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function nearbyCards(current){
 if(!current.coords)return [];
 return places
   .filter(p=>p.id!==current.id&&p.coords)
   .map(p=>({p,d:geoDistance(current.coords,p.coords)}))
   .sort((a,b)=>(a.d-b.d)||a.p.name.localeCompare(b.p.name))
   .slice(0,4)
   .map(x=>x.p);
}
function instagram(id){const p=places.find(x=>x.id==id);window.open(p.ig,"_blank")}
function go(id){
 const p=places.find(x=>x.id==id);
 let url=p.coords?`https://www.google.com/maps/dir/?api=1&destination=${p.coords[0]},${p.coords[1]}&destination_place_id=&travelmode=driving`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+" "+p.address+" La Union")}`;
 addHistory(p);window.open(url,"_blank");
}
function addHistory(p){
 let h=JSON.parse(localStorage.getItem("lu_history")||"[]");
 h.unshift({name:p.name,time:new Date().toISOString()});localStorage.setItem("lu_history",JSON.stringify(h.slice(0,40)));
}
function renderHistory(){
 let h=JSON.parse(localStorage.getItem("lu_history")||"[]");
 document.getElementById("historyList").innerHTML=h.length?h.map(x=>`<div class="historyitem"><b>${esc(x.name)}</b><small>${new Date(x.time).toLocaleString()}</small></div>`).join(""):`<div class="empty">Your places will appear here after you tap Maps.</div>`;
}
function initMap(){
 if(map)return;
 map=L.map("realMap",{zoomControl:true}).setView([16.6697,120.3198],15);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
 renderMapMarkers();setTimeout(()=>map.invalidateSize(),150);
}
function renderMapMarkers(){
 if(!map)return;markers.forEach(m=>m.remove());markers=[];
 places.filter(p=>p.coords).forEach(p=>{
  let m=L.marker(p.coords).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.category)} · ${esc(p.price)}<br><button class="btn view" onclick="detail('${p.id}')">More Details</button>`);
  markers.push(m);
 });
}
function locate(){
 if(!navigator.geolocation){renderCategory();return}
 navigator.geolocation.getCurrentPosition(pos=>{
  userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
  renderCategory();
  if(map){if(userMarker)userMarker.remove();userMarker=L.circleMarker([userPos.lat,userPos.lng],{radius:8,color:"#fff",weight:3,fillColor:"#6698cc",fillOpacity:1}).addTo(map).bindPopup("<b>You are here</b>");map.setView([userPos.lat,userPos.lng],15)}
 },()=>renderCategory(),{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
document.addEventListener("DOMContentLoaded",()=>{
 locate();
});
window.addEventListener("pageshow",locate);
document.getElementById("landing").addEventListener("click",()=>{});
