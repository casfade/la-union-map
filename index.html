<html lang="en">
<head>

<title>La Union Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#202020;--muted:#777;--line:#e8e8e8;--bg:#faf9f6;--card:#fff;
  --radius:18px;--gap:14px;--max:760px;--tab:#f4f2ee;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{font-size:15px;font-weight:400}.app{max-width:var(--max);margin:auto;min-height:100vh;padding-bottom:28px}
button,input{font:inherit} button{border:0;cursor:pointer}.hidden{display:none!important}
.page{padding:18px 16px 32px}.landing{padding-top:12px}
.search{display:flex;gap:8px;margin-bottom:20px}
.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 16px;outline:none;font-size:15px}
.feature-wrap{margin-bottom:28px}
.feature-card{position:relative;overflow:hidden;border-radius:16px;background:#ddd;min-height:310px;cursor:pointer}
.feature-card img{width:100%;height:100%;min-height:310px;object-fit:cover;display:block}
.feature-placeholder{height:100%;min-height:310px;display:flex;align-items:flex-end;padding:22px;background:linear-gradient(135deg,#dfe8e1,#e8ded3)}
.feature-copy{position:absolute;left:0;right:0;bottom:0;padding:46px 20px 20px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.feature-copy h2{margin:0 0 7px;font-size:23px;font-weight:700}.feature-copy p{margin:0;line-height:1.5;max-width:90%}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.dot{width:6px;height:6px;border-radius:50%;background:#bbb}.dot.active{background:#333}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:0 0 10px;color:#666}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bento button{min-height:96px;border-radius:16px;padding:14px 10px;text-align:left;background:var(--c);color:var(--ink);font-weight:700;font-size:14px}
.bento .emoji{display:block;font-size:22px;margin-bottom:12px}
.bottom-tabs{display:flex;gap:10px;position:fixed;z-index:50;left:50%;bottom:14px;transform:translateX(-50%);width:min(calc(100% - 28px),520px);padding:8px;border:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.bottom-tabs button{flex:1;background:transparent;color:#777;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px}
.bottom-tabs svg{width:25px;height:25px;stroke:#777;fill:none;stroke-width:2.2}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:20px}
.crumb{font-size:13px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{height:180px;border-radius:16px;background:#ddd;overflow:hidden;margin:0 0 20px;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}.cover-fallback{width:100%;height:100%;display:flex;align-items:center;padding:20px;font-size:28px;font-weight:700}
.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.brand-card{display:grid;grid-template-columns:118px 1fr;min-height:128px;cursor:pointer}
.brand-image{position:relative;background:#e4dfd5;min-height:128px}.brand-image img{width:100%;height:100%;object-fit:cover}
.initials{height:100%;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700}
.status-banner{position:absolute;left:0;top:0;padding:6px 9px;background:#fff;font-size:11px;font-weight:700;border-bottom-right-radius:10px}
.brand-body{padding:13px}.brand-title-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.brand-title{font-size:16px;font-weight:700;margin:0;line-height:1.25}.price{font-size:12px;font-weight:700;white-space:nowrap}
.meta{font-size:12px;color:#666;margin-top:6px}.desc{font-size:13px;line-height:1.45;margin-top:7px}.highlight{font-size:12px;font-weight:700;margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:10px;border:1px solid #ddd;border-radius:999px;padding:4px 7px}
.btn{height:40px;padding:0 14px;border-radius:12px;background:#202020;color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.light{background:#f3f1ed;color:#222}.btn-row{display:flex;gap:8px;margin-top:12px}.btn-row .btn{flex:1}
.sorts{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.sorts button{height:34px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}.sorts button.active{background:#202020;color:#fff}
.nearest{margin-bottom:18px}.nearest h3{font-size:14px;margin:0 0 9px;font-weight:700}
.landmark-card{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:13px}.landmark-icon{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#eee;font-size:23px}.landmark-name{font-size:14px;font-weight:700}.landmark-desc{font-size:12px;color:#666;margin-top:4px;line-height:1.35}.distance{font-size:11px;color:#666;white-space:nowrap}
.detail-cover{height:220px}.detail-name-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.detail-name{font-size:22px;font-weight:700;line-height:1.15}.status-pill{font-size:11px;font-weight:700;white-space:nowrap}
.cuisine-banner{font-size:11px;font-weight:700;padding:7px 10px;border-radius:10px;background:#eee;margin-bottom:12px}.detail-section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}.detail-section h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#666;margin:0 0 8px;font-weight:700}.detail-section p{margin:0;line-height:1.55;font-size:14px}
.transport-tabs{display:flex;gap:8px;margin-bottom:16px}.transport-tabs button{flex:1;height:42px;border-radius:12px;background:#f1efeb;font-size:12px;font-weight:700}.transport-tabs button.active{background:#202020;color:#fff}
.transport-row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:11px;padding:11px}.profile{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#ddd;display:flex;align-items:center;justify-content:center;font-weight:700}.transport-name{font-weight:700;font-size:14px}.transport-desc{font-size:12px;color:#666;margin-top:4px}.em-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px}.em-name{font-weight:700;font-size:14px}.em-desc{font-size:12px;color:#666;margin-top:4px;line-height:1.35}.call{height:42px;min-width:105px}
#map{height:55vh;border-radius:16px;border:1px solid var(--line)}.empty{padding:28px;text-align:center;color:#777;background:#fff;border:1px solid var(--line);border-radius:16px}
@media(max-width:430px){
  .feature-card,.feature-placeholder,.feature-card img{min-height:290px}.bento button{min-height:88px;font-size:13px}
  .brand-card{grid-template-columns:105px 1fr}.em-row{grid-template-columns:1fr auto}.em-row .call{grid-column:2;grid-row:1 / span 2}
}

/* Mobile interaction hardening */
html, body { -webkit-tap-highlight-color: transparent; }
button, a, [role="button"], .card, .category-card, .feature-card {
  touch-action: manipulation;
}
button, a { position: relative; z-index: 2; }


.distance{font-size:13px;color:#555;margin:2px 0 8px}
.static-feature{height:auto!important;aspect-ratio:2.2/1;overflow:hidden;pointer-events:none}
.static-feature img{width:100%;height:100%;object-fit:cover;display:block}
.location-modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9999;padding:14px}
.location-sheet{width:min(100%,520px);background:#fff;border-radius:24px;padding:24px 20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center}
.location-sheet h3{margin:6px 0 8px;font-size:20px}
.location-sheet p{margin:0 0 18px;color:#666;line-height:1.45}
.location-icon{font-size:30px}
.location-sheet .primary{width:100%;height:48px;background:#202020;color:#fff;border-radius:14px}
.location-skip{margin-top:10px;background:transparent;color:#777;padding:8px}
.transport-info{min-width:0;flex:1}
.em-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.em-row .call{white-space:nowrap}
</style>

<script>
(function(){
  let lastAction=0;
  document.addEventListener('click', function(e){
    const interactive=e.target.closest('a,button,[role="button"],.card,.category-card,.feature-card');
    if(!interactive) return;
    const now=Date.now();
    if(now-lastAction<350){
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    lastAction=now;
  }, true);
})();
</script>

const cats = ["Food","Drink","Dessert","Nightlife","Activities","Landmarks"];
const icons = {Food:"🍴",Drink:"☕",Dessert:"🍨",Nightlife:"🌙",Activities:"🏄",Landmarks:"📍"};
let userPos = null, sortMode="nearest", currentPage="home", currentCategory="";
let featureIndex=0, featureTimer=null;

function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function initials(name){return String(name||"").split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join("").toUpperCase();}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-");}
function mapsUrl(p){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((p.name||"")+" "+(p.address||""));}
function openExternal(url){
  if(!url || url==='#' || url==='https://www.facebook.com/' || url==='https://instagram.com/' || url==='https://www.instagram.com/') return;
  window.location.href=url;
}
function distanceKm(a,b,c,d){const R=6371, p=Math.PI/180, x=(c-a)*p, y=(d-b)*p;const q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
function distanceText(lat,lon){if(userPos&&lat!=null&&lon!=null){let d=distanceKm(userPos.lat,userPos.lon,lat,lon);return d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km"}return "Location unavailable";}

function parseTime(s){
  let m=String(s||"").match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i); if(!m)return null;
  let h=+m[1], min=+(m[2]||0), ap=(m[3]||"").toUpperCase();
  if(ap==="PM"&&h<12)h+=12;
  if(ap==="AM"&&h===12)h=0;
  return h*60+min;
}
function dayKey(){return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];}
function fmtTime(mins){
  let h=Math.floor((mins%1440)/60), m=mins%60, ap=h>=12?"PM":"AM", hh=h%12||12;
  return hh+(m?":"+String(m).padStart(2,"0"):"")+ap;
}
function todaySlots(p){
  let h=p.hours||{};
  return h[dayKey()] ?? h.Daily ?? [];
}
function status(p){
  let slots=todaySlots(p);
  if(!Array.isArray(slots) || !slots.length) return {label:"Closed",kind:"closed"};
  let now=new Date().getHours()*60+new Date().getMinutes();
  for(const slot of slots){
    let open=parseTime(slot[0]), close=parseTime(slot[1]);
    if(open==null||close==null) continue;
    let end=close;
    if(end<=open) end+=1440;
    let n=now;
    if(n<open && end>1440) n+=1440;
    if(n>=open && n<end){
      let remaining=end-n;
      return {label:"Open til "+fmtTime(end),kind:remaining<=60?"soon":"open"};
    }
  }
  return {label:"Closed",kind:"closed"};
}
function distanceVal(p){
  if(!userPos || p.lat==null || p.lon==null) return Infinity;
  return distanceKm(userPos.lat,userPos.lon,p.lat,p.lon);
}
function distanceLabel(p){
  if(!userPos || p.lat==null || p.lon==null) return "Distance unavailable";
  let d=distanceVal(p);
  return d<1 ? Math.round(d*1000)+" m away" : d.toFixed(1)+" km away";
}
function cardImage(p, cls="brand-image"){
  if(p.photos&&p.photos[0]) return '<div class="'+cls+'"><img src="'+escapeHtml(p.photos[0])+'" alt=""></div>';
  let cat=p.primary||"Food"; return '<div class="'+cls+'" style="background:'+({"Food":"#E7D7C9","Drink":"#DDE7E0","Dessert":"#E9DFE8","Nightlife":"#DED9E7","Activities":"#DCE6E8","Landmarks":"#E4E0D4"}[cat]||"#ddd")+'"><div class="initials">'+escapeHtml(initials(p.name))+'</div></div>';
}
function brandCard(p){
  const st=status(p), cats=p.categories||[], price=p.price||"";
  return '<article class="card brand-card" onclick="brandDetail(\''+p.id+'\')">'+
    '<div style="position:relative">'+cardImage(p)+
    '<span class="status-banner">'+escapeHtml(st.label)+'</span></div>'+
    '<div class="brand-body"><div class="brand-title-row"><h3 class="brand-title">'+escapeHtml(p.name)+'</h3><span class="price">'+escapeHtml(price)+'</span></div>'+
    '<div class="distance">'+escapeHtml(distanceLabel(p))+'</div>'+
    (p.cuisine||p.venue?'<div class="meta">'+escapeHtml((p.country?p.country+" ":"")+(p.cuisine||p.venue||""))+'</div>':'')+
    '<div class="desc">'+escapeHtml(p.description)+'</div>'+
    (p.highlight?'<div class="highlight">★ '+escapeHtml(p.highlight)+'</div>':'')+
    '<div class="tags">'+cats.map(c=>'<span class="tag">'+escapeHtml(c)+'</span>').join("")+'</div></div></article>';
}
function cover(title,cat){
  return '<div class="cover"><div class="cover-fallback" style="background:'+({"Food":"#E7D7C9","Drink":"#DDE7E0","Dessert":"#E9DFE8","Nightlife":"#DED9E7","Activities":"#DCE6E8","Landmarks":"#E4E0D4"}[cat]||"#ddd")+'">'+escapeHtml(title)+'</div></div>';
}

function updateFeaturedOnly(){return;}
function legacyUpdateFeaturedOnly(){
  const host=document.getElementById('featuredHost');
  if(!host || !featured.length) return;
  const b=featured[featureIndex % featured.length];
  host.innerHTML=featuredCard(b);
  const dots=document.getElementById('featuredDots');
  if(dots) dots.innerHTML=featured.map((_,i)=>`<span class="dot ${i===featureIndex%featured.length?'active':''}"></span>`).join('');
  const card=host.querySelector('[data-featured-id]');
  if(card){
    card.addEventListener('click',()=>openExternal(b.instagram||''));
  }
}

function renderHome(){
  currentPage="home"; currentCategory="";
  document.getElementById("tabs").classList.remove("hidden");
  let featured='<section class="feature-wrap"><div class="feature-card static-feature"><img src="'+STATIC_PHOTO+'" alt="La Union beach"></div></section>';
  let html='<div class="page landing"><div class="search"><input id="homeSearch" placeholder="Where are you going today?.." oninput="searchHome(this.value)"></div>'+featured+
    '<section><div class="section-title">Explore</div><div class="bento">'+cats.map(c=>'<button style="--c:'+({"Food":"#E7D7C9","Drink":"#DDE7E0","Dessert":"#E9DFE8","Nightlife":"#DED9E7","Activities":"#DCE6E8","Landmarks":"#E4E0D4"}[c])+'" onclick="showCategory(\''+c+'\')"><span class="emoji">'+icons[c]+'</span>'+c+'</button>').join("")+'</div></section>'+
    '<section id="searchFeed" class="list" style="margin-top:18px"></section></div>';
  document.getElementById("app").innerHTML=html;
  if(featureTimer){clearInterval(featureTimer);featureTimer=null;}
  showLocationPrompt();
}
function searchHome(q){
  q=q.trim().toLowerCase(); let box=document.getElementById("searchFeed"); if(!box)return;
  if(!q){box.innerHTML="";return}
  let arr=DATA.brands.filter(b=>(b.name+" "+b.description+" "+b.cuisine+" "+b.venue).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=arr.length?'<div class="section-title">Results</div>'+arr.map(brandCard).join(""):'<div class="empty">No matches yet.</div>';
}
function showCategory(cat){
  if(cat==="Landmarks"){renderLandmarks();return;}
  currentPage="category"; currentCategory=cat; document.getElementById("tabs").classList.add("hidden");
  let arr=DATA.brands.filter(b=>b.primary===cat);
  arr.sort((a,b)=>{let so=(status(a).kind==="closed")-(status(b).kind==="closed"); if(so)return so; return distanceVal(a)-distanceVal(b);});
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="renderHome()">‹</button><div class="crumb">'+escapeHtml(cat)+'</div></div>'+cover(cat,cat)+'<div class="sorts"><button class="active" onclick="sortBrands(this,\'open\')">Open Now</button><button onclick="sortBrands(this,\'alpha\')">A–Z</button><button onclick="sortBrands(this,\'price\')">Price</button><button onclick="sortBrands(this,\'distance\')">Nearest</button></div><div id="brandList" class="list">'+arr.map(brandCard).join("")+'</div></div>';
}
function sortBrands(btn,mode){
  document.querySelectorAll(".sorts button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
  let arr=DATA.brands.filter(b=>b.primary===currentCategory);
  if(mode==="alpha")arr.sort((a,b)=>a.name.localeCompare(b.name));
  if(mode==="price")arr.sort((a,b)=>a.price.localeCompare(b.price));
  if(mode==="distance")arr.sort((a,b)=>distanceVal(a)-distanceVal(b));
  if(mode==="open")arr.sort((a,b)=>{let so=(status(a).kind==="closed")-(status(b).kind==="closed");return so||distanceVal(a)-distanceVal(b);});
  document.getElementById("brandList").innerHTML=arr.map(brandCard).join("");
}
function brandDetail(id){
  let p=DATA.brands.find(x=>x.id===id);if(!p)return;document.getElementById("tabs").classList.add("hidden");
  let st=status(p), photo=p.photos&&p.photos[0];
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="history.back();showCategory(\''+escapeHtml(p.primary)+'\')">‹</button><div class="crumb">'+escapeHtml(p.primary)+'</div></div>'+
  '<div class="cover detail-cover">'+(photo?'<img src="'+escapeHtml(photo)+'" alt="">':'<div class="cover-fallback" style="background:'+({"Food":"#E7D7C9","Drink":"#DDE7E0","Dessert":"#E9DFE8","Nightlife":"#DED9E7","Activities":"#DCE6E8","Landmarks":"#E4E0D4"}[p.primary]||"#ddd")+'">'+escapeHtml(initials(p.name))+'</div>')+'</div>'+
  '<div class="detail-name-row"><div class="detail-name">'+escapeHtml(p.name)+'</div><div class="status-pill">'+escapeHtml(st.label)+'</div></div>'+
  (p.cuisine||p.venue?'<div class="cuisine-banner">'+escapeHtml((p.country?p.country+" ":"")+(p.cuisine||"")+(p.venue?" · "+p.venue:""))+'</div>':'')+
  '<div class="detail-section"><h3>About</h3><p>'+escapeHtml(p.description)+'</p></div>'+
  (p.highlight?'<div class="detail-section"><h3>Highlight</h3><p>'+escapeHtml(p.highlight)+'</p></div>':'')+
  '<div class="detail-section"><h3>Hours</h3><p>'+escapeHtml(p.schedule||"Hours Vary")+'</p></div>'+
  '<div class="detail-section"><h3>Location</h3><p>'+escapeHtml(p.address||"Location unavailable")+'</p><div class="btn-row"><a class="btn" href="'+mapsUrl(p)+'">Maps</a>'+(p.ig?'<a class="btn light" href="'+escapeHtml(p.ig)+'">Instagram</a>':'')+'</div></div></div>';
}
function showPage(page){
  document.getElementById("tabs").classList.remove("hidden");
  if(page==="transport")renderTransport();
  else if(page==="nearby")renderNearby();
  else if(page==="emergency")renderEmergency();
}
function renderNearby(){
  document.getElementById("tabs").classList.add("hidden");
  let arr=DATA.brands.slice().sort((a,b)=>((status(a).kind==="closed")-(status(b).kind==="closed")) || ((userPos&&a.lat!=null)?distanceKm(userPos.lat,userPos.lon,a.lat,a.lon):9999)-((userPos&&b.lat!=null)?distanceKm(userPos.lat,userPos.lon,b.lat,b.lon):9999));
  let near=arr.slice(0,2);
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="renderHome()">‹</button><div class="crumb">Nearby</div></div>'+cover("Nearby","Activities")+'<div class="nearest"><h3>Nearest Favorites</h3><div class="list">'+near.map(brandCard).join("")+'</div></div><div class="sorts"><button class="active">Open first</button><button>A–Z</button><button>Price</button><button>Distance</button></div><div class="list">'+arr.map(brandCard).join("")+'</div></div>';
}
function renderLandmarks(){
  document.getElementById("tabs").classList.add("hidden");
  let arr=DATA.landmarks.slice().sort((a,b)=>(a.lat==null)-(b.lat==null)||distanceVal(a)-distanceVal(b));
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="renderHome()">‹</button><div class="crumb">Landmarks</div></div>'+cover("Landmarks","Landmarks")+'<div class="sorts"><button class="active" onclick="sortLand(this,\'distance\')">Distance</button><button onclick="sortLand(this,\'alpha\')">A–Z</button><button onclick="sortLand(this,\'nearest\')">Nearest</button></div><div id="landmarkList" class="list">'+arr.map(landmarkCard).join("")+'</div></div>';
}
function distanceVal(x){return userPos&&x.lat!=null?distanceKm(userPos.lat,userPos.lon,x.lat,x.lon):9999}
function landmarkCard(l){return '<article class="card landmark-card" onclick="openExternal(\''+escapeHtml(l.maps||mapsUrl(l))+'\')"><div class="landmark-icon">'+escapeHtml(l.icon)+'</div><div><div class="landmark-name">'+escapeHtml(l.name)+'</div><div class="landmark-desc">'+escapeHtml(l.description)+'</div></div><div class="distance">'+escapeHtml(distanceText(l.lat,l.lon))+'</div></article>'}
function sortLand(btn,mode){document.querySelectorAll(".sorts button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");let a=DATA.landmarks.slice();if(mode==="alpha")a.sort((x,y)=>x.name.localeCompare(y.name));else a.sort((x,y)=>distanceVal(x)-distanceVal(y));document.getElementById("landmarkList").innerHTML=a.map(landmarkCard).join("")}
function renderTransport(){
  document.getElementById("tabs").classList.add("hidden");
  let type="Drivers";
  function render(){
    let arr=DATA.transport.filter(x=>x.type===type);
    document.getElementById("transportList").innerHTML=arr.map(t=>'<article class="card transport-row"><div class="profile">'+(t.photo?'<img class="profile" src="'+escapeHtml(t.photo)+'">':escapeHtml(initials(t.name)))+'</div><div class="transport-info"><div class="transport-name">'+escapeHtml(t.name)+'</div><div class="transport-desc">'+escapeHtml(t.description)+'</div></div><a class="btn" href="'+escapeHtml(t.facebook)+'">Book</a></article>').join("");
  }
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="renderHome()">‹</button><div class="crumb">Transport</div></div>'+cover("Transport","Activities")+'<div style="height:12px"></div><div class="transport-tabs">'+["Drivers","Motorcycle Rental","Car Rental"].map((x,i)=>'<button class="'+(i===0?"active":"")+'" onclick="selectTransportTab(this,\''+x+'\')">'+x+'</button>').join("")+'</div><div id="transportList" class="list"></div></div>';
  window.selectTransportTab=function(btn,nextType){type=nextType;document.querySelectorAll(".transport-tabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render();};
  render();
}
function renderEmergency(){
  document.getElementById("tabs").classList.add("hidden");
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="renderHome()">‹</button><div class="crumb">Emergency</div></div>'+cover("Emergency","Nightlife")+'<div class="list">'+DATA.emergency.map(e=>'<article class="card em-row"><div><div class="em-name">'+escapeHtml(e.icon+" "+e.name)+'</div><div class="em-desc">'+escapeHtml(e.description)+' · '+escapeHtml(e.phone)+'</div></div><a class="btn call" href="tel:'+escapeHtml(e.phone.replace(/[^0-9+]/g,""))+'">Call Now</a></article>').join("")+'</div></div>';
}
function showLocationPrompt(){
  if(document.getElementById("locationPrompt")) return;
  let d=document.createElement("div");
  d.id="locationPrompt";
  d.className="location-modal";
  d.innerHTML='<div class="location-sheet"><div class="location-icon">⌖</div><h3>Turn on location</h3><p>Use your current location to show nearby places and sort Food by distance.</p><button class="btn primary" onclick="enableLocation()">Turn on location</button><button class="location-skip" onclick="closeLocationPrompt()">Not now</button></div>';
  document.body.appendChild(d);
}
function closeLocationPrompt(){let x=document.getElementById("locationPrompt");if(x)x.remove();}
function enableLocation(){
  if(!navigator.geolocation){closeLocationPrompt();return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};
    closeLocationPrompt();
    if(currentPage==="category") showCategory(currentCategory);
  },()=>{
    closeLocationPrompt();
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function requestLocation(){showLocationPrompt();}
function refreshCurrentDistances(){
  if(currentPage==="category") showCategory(currentCategory);
}
renderHome();requestLocation();
</script>
