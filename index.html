<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Union Map — V44</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#202020;--muted:#777;--line:#e8e8e8;--bg:#faf9f6;--card:#fff;
  --radius:18px;--gap:14px;--max:760px;--tab:#f4f2ee;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{font-size:15px;font-weight:400}.app{max-width:var(--max);margin:auto;min-height:100vh;padding-bottom:28px}
button,input{font:inherit} button{border:0;cursor:pointer}.hidden{display:none!important}
.page{padding:18px 16px 32px}.landing{padding-top:12px}
.search{display:flex;gap:8px;margin-bottom:20px}
.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 16px;outline:none;font-size:15px}
.feature-wrap{margin-bottom:28px}
.feature-card{position:relative;overflow:hidden;border-radius:16px;background:#ddd;min-height:310px;cursor:pointer}
.feature-card img{width:100%;height:100%;min-height:310px;object-fit:cover;display:block}
.feature-placeholder{height:100%;min-height:310px;display:flex;align-items:flex-end;padding:22px;background:linear-gradient(135deg,#dfe8e1,#e8ded3)}
.feature-copy{position:absolute;left:0;right:0;bottom:0;padding:46px 20px 20px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.feature-copy h2{margin:0 0 7px;font-size:23px;font-weight:700}.feature-copy p{margin:0;line-height:1.5;max-width:90%}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.dot{width:6px;height:6px;border-radius:50%;background:#bbb}.dot.active{background:#333}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:0 0 10px;color:#666}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bento button{min-height:96px;border-radius:16px;padding:14px 10px;text-align:left;background:var(--c);color:var(--ink);font-weight:700;font-size:14px}
.bento .emoji{display:block;font-size:22px;margin-bottom:12px}
.bottom-tabs{display:flex;gap:10px;position:fixed;z-index:50;left:50%;bottom:14px;transform:translateX(-50%);width:min(calc(100% - 28px),520px);padding:8px;border:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.bottom-tabs button{flex:1;background:transparent;color:#777;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px}
.bottom-tabs svg{width:25px;height:25px;stroke:#777;fill:none;stroke-width:2.2}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:48px;height:48px;min-width:48px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}.crumb{min-height:48px;padding:0 17px;border-radius:999px;display:flex;align-items:center;background:#fff;border:1px solid var(--line);font-size:15px}
.crumb{font-size:13px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{height:180px;border-radius:16px;background:#ddd;overflow:hidden;margin:0 0 20px;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}.cover-fallback{width:100%;height:100%;display:flex;align-items:center;padding:20px;font-size:28px;font-weight:700}
.list{display:grid;gap:12px}.search-results:empty{display:none}.search-results .section-title{margin-top:0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.brand-card{display:grid;grid-template-columns:118px minmax(0,1fr);min-height:128px;cursor:pointer;align-items:stretch}
.brand-image{position:relative;background:#e4dfd5;height:100%;min-height:100%;overflow:hidden}.brand-image img{display:block;width:100%;height:100%;min-height:100%;object-fit:cover}
.initials{height:100%;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700}
.status-banner{position:absolute;left:0;top:0;padding:6px 9px;background:#fff;font-size:11px;font-weight:700;border-bottom-right-radius:10px}.status-banner.status-open,.status-pill.status-open{background:#dff3e4;color:#176b2c}.status-banner.status-soon,.status-pill.status-soon{background:#fff0d6;color:#9a5b00}.status-banner.status-closed,.status-pill.status-closed{background:#f9dddd;color:#a52a2a}
.brand-body{padding:13px}.brand-title-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.brand-title{font-size:16px;font-weight:700;margin:0;line-height:1.25}.price{font-size:12px;font-weight:700;white-space:nowrap}
.meta{font-size:12px;color:#666;margin-top:6px}.desc{font-size:13px;line-height:1.45;margin-top:7px}.highlight{font-size:12px;font-weight:700;margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:10px;border:1px solid #ddd;border-radius:999px;padding:4px 7px}
.btn{height:40px;padding:0 14px;border-radius:12px;background:#202020;color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.light{background:#f3f1ed;color:#222}.btn-row{display:flex;gap:8px;margin-top:12px}.btn-row .btn{flex:1}
.sorts{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.sorts button{height:34px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}.sorts button.active{background:#202020;color:#fff}
.nearest{margin-bottom:18px}.nearest h3{font-size:14px;margin:0 0 9px;font-weight:700}
.landmark-card{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:13px}.landmark-icon{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#eee;font-size:23px}.landmark-name{font-size:14px;font-weight:700}.landmark-desc{font-size:12px;color:#666;margin-top:4px;line-height:1.35}.distance{font-size:11px;color:#666;white-space:nowrap}
.location-note{font-size:12px;color:#666;margin:-4px 0 12px}.location-inline{background:none;padding:0;color:#333;text-decoration:underline;font-size:12px}.landmark-main{min-width:0}.landmark-go{height:36px;padding:0 11px;font-size:11px;white-space:nowrap}
.detail-cover{height:220px}.detail-name-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.detail-name{font-size:22px;font-weight:700;line-height:1.15}.status-pill{font-size:11px;font-weight:700;white-space:nowrap}
.cuisine-banner{font-size:11px;font-weight:700;padding:7px 10px;border-radius:10px;background:#eee;margin-bottom:12px}.detail-section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}.detail-section h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#666;margin:0 0 8px;font-weight:700}.detail-section p{margin:0;line-height:1.55;font-size:14px}
.transport-tabs{display:flex;gap:8px;margin-bottom:16px}.transport-tabs button{flex:1;height:42px;border-radius:12px;background:#f1efeb;font-size:12px;font-weight:700}.transport-tabs button.active{background:#202020;color:#fff}
.transport-row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:11px;padding:11px}.profile{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#ddd;display:flex;align-items:center;justify-content:center;font-weight:700}.transport-name{font-weight:700;font-size:14px}.transport-desc{font-size:12px;color:#666;margin-top:4px}.em-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px}.em-name{font-weight:700;font-size:14px}.em-desc{font-size:12px;color:#666;margin-top:4px;line-height:1.35}.call{height:42px;min-width:105px}
#map{height:55vh;border-radius:16px;border:1px solid var(--line)}.empty{padding:28px;text-align:center;color:#777;background:#fff;border:1px solid var(--line);border-radius:16px}
@media(max-width:430px){
  .feature-card,.feature-placeholder,.feature-card img{min-height:290px}.bento button{min-height:88px;font-size:13px}
  .brand-card{grid-template-columns:105px minmax(0,1fr)}.em-row{grid-template-columns:1fr auto}.em-row .call{grid-column:2;grid-row:1 / span 2}.landmark-card{grid-template-columns:46px minmax(0,1fr);}.landmark-icon{width:46px;height:46px}.landmark-go{grid-column:2;justify-self:start;margin-top:2px}
}

/* Mobile interaction hardening */
html, body { -webkit-tap-highlight-color: transparent; }
button, a, [role="button"], .card, .category-card, .feature-card {
  touch-action: manipulation;
}
button, a { position: relative; z-index: 2; }


.distance{font-size:13px;color:#555;margin:2px 0 8px}
.static-feature{height:auto!important;aspect-ratio:2.2/1;overflow:hidden;pointer-events:none}
.static-feature img{width:100%;height:100%;object-fit:cover;display:block}
.location-modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9999;padding:14px}
.location-sheet{width:min(100%,520px);background:#fff;border-radius:24px;padding:24px 20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center}
.location-sheet h3{margin:6px 0 8px;font-size:20px}
.location-sheet p{margin:0 0 18px;color:#666;line-height:1.45}
.location-icon{font-size:30px}
.location-sheet .primary{width:100%;height:48px;background:#202020;color:#fff;border-radius:0}
.location-skip{margin-top:10px;background:transparent;color:#777;padding:8px}
.transport-info{min-width:0;flex:1}
.em-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.em-row .call{white-space:nowrap}

/* Responsive featured + cuisine treatment */
.feature-wrap{width:100%;margin:0 0 18px}
.static-feature{width:100%;aspect-ratio:16/7;height:auto!important;border-radius:18px;overflow:hidden}
.static-feature img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:600px){
  .feature-wrap{margin-bottom:16px}
  .static-feature{aspect-ratio:16/8.5;border-radius:16px}
}
.cuisine-chip{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.1px;background:#f0f0f0;color:#222}
.cuisine-chip[data-cuisine="Japanese"]{background:#f4dede;color:#8a3030}
.cuisine-chip[data-cuisine="Italian"]{background:#e6f0d9;color:#47652b}
.cuisine-chip[data-cuisine="Filipino"]{background:#f6e6c7;color:#7a4d12}
.cuisine-chip[data-cuisine="Thai"]{background:#e5dff3;color:#5b4788}
.cuisine-chip[data-cuisine="Indonesian"]{background:#f1dfc9;color:#80502d}
.cuisine-chip[data-cuisine="American"]{background:#dce9f4;color:#3c607d}
.cuisine-chip[data-cuisine="Hawaiian"]{background:#d9eee8;color:#276b5c}
.cuisine-chip[data-cuisine="Coffee"]{background:#e8ddd3;color:#6b4b35}
.cuisine-chip[data-cuisine="Mexican"]{background:#f3dfd1;color:#91452d}
.cuisine-chip[data-cuisine="Pizza"]{background:#f5dfd2;color:#8d4930}
.cuisine-chip[data-cuisine="Ice Cream"]{background:#e9e0f1;color:#684a7d}
.cuisine-chip[data-cuisine="Photography"]{background:#e1e7f0;color:#4b5e78}

.hours-detail{margin:16px 0;padding:14px;border-radius:16px;background:#f7f7f7}
.detail-label{font-size:13px;font-weight:700;margin-bottom:8px}
.hours-line{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid #e5e5e5;font-size:13px}
.hours-line:last-child{border-bottom:0}
.hours-line span:last-child{text-align:right}

.top{position:sticky;top:10px;z-index:1000;display:flex;align-items:center;gap:10px;padding:8px 0;pointer-events:none}
.top .back,.top .crumb{pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.10);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(255,255,255,.94);border-radius:999px}
.top .crumb{padding:8px 13px}
.em-row a,.em-row a:visited,.em-row a:hover,.em-row .em-desc{text-decoration:none!important}
.landmark-distance{font-size:13px;color:#555;margin:4px 0 7px}






.hours-calendar-card{margin:16px 0;padding:14px 16px;border:1px solid #e2e2e2;border-radius:16px;background:#fff}
.hours-calendar-card .detail-label{font-size:12px;font-weight:500;letter-spacing:.8px;color:#555;margin-bottom:10px}
.hours-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hours-day-card{min-width:0;min-height:66px;padding:9px 6px;border:1px solid #e7e7e7;border-radius:10px;background:#fafafa;display:flex;flex-direction:column;justify-content:space-between}
.hours-day-name{font-size:11px;font-weight:700;color:#555}
.hours-day-time{font-size:12px;line-height:1.35;color:#171717;word-break:normal}
@media(max-width:700px){
  .hours-calendar-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .hours-day-card{min-height:62px;padding:9px 10px}
  .hours-day-name{font-size:12px}
  .hours-day-time{font-size:13px}
}
@media(max-width:380px){
  .hours-calendar-grid{grid-template-columns:1fr 1fr}
  .hours-day-card{min-height:58px}
  .hours-day-time{font-size:12px}
}

/* Edge-to-edge card photography */
.brand-card{overflow:hidden;padding:0!important}
.brand-card .card-image,.brand-card .image-wrap,.brand-card .brand-image{border-radius:0!important}
.brand-card>div:first-child{border-radius:0!important}
.brand-card img{border-radius:0!important}
.brand-body{padding:14px 16px 16px}
.category-section-title{margin:20px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.8px;color:#666}

/* =========================================================
   LA UNION MAP V44 — UI REDESIGN
   Presentation layer only. V43 data, routes and behaviors remain.
   ========================================================= */
:root{
  --ink:#11110f;
  --muted:#716f69;
  --line:rgba(17,17,15,.11);
  --bg:#11110f;
  --card:#f7f3e9;
  --radius:24px;
  --gap:14px;
  --max:760px;
  --tab:#f3efe5;

  --food:#f5a36a;
  --drink:#c8e8d5;
  --dessert:#f0c9e4;
  --nightlife:#c7b8ee;
  --activities:#a9dfe7;
  --landmarks:#e8d39a;
  --transport:#cbd9f0;
  --emergency:#ef8e83;
}
html,body{
  font-family:"DM Sans",Arial,Helvetica,sans-serif;
  background:#11110f;
  color:#f7f3e9;
}
body{font-size:15px;overflow-x:hidden}
.app{max-width:760px;background:#11110f;min-height:100vh;padding-bottom:100px}
.page{padding:18px 18px 38px}
.landing{padding:16px 18px 44px;min-height:100vh;background:#11110f}
button,input{font-family:"DM Sans",Arial,sans-serif}
button{transition:transform .18s ease,opacity .18s ease,background .22s ease}
button:active,.card:active,.feature-card:active{transform:scale(.985)}
*{-webkit-tap-highlight-color:transparent}

/* Home */
.home-header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 34px}
.brand-mark{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;color:#f7f3e9}
.brand-mark span{opacity:.45}
.header-dot{width:11px;height:11px;border-radius:50%;background:#f5a36a;box-shadow:0 0 0 5px rgba(245,163,106,.10)}
.hero-copy{padding:0 2px 26px}
.eyebrow,.section-heading span{font-size:10px;font-weight:700;letter-spacing:.16em;color:#96938b}
.hero-copy h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(46px,12vw,78px);line-height:.91;letter-spacing:-.055em;margin:10px 0 18px;font-weight:600}
.hero-copy h1 em{font-style:normal;color:#f5a36a}
.hero-copy p{max-width:450px;margin:0;color:#aaa69d;font-size:15px;line-height:1.55}
.home-search{margin:0 0 20px!important}
.search{display:flex;gap:0}
.search input{
  width:100%;height:58px;border:1px solid rgba(255,255,255,.10);border-radius:18px;
  background:#1b1b19;color:#f7f3e9;padding:0 18px 0 52px;outline:none;font-size:15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.search input::placeholder{color:#77746e}
.search input:focus{border-color:rgba(245,163,106,.55);box-shadow:0 0 0 4px rgba(245,163,106,.08)}
.search-icon{position:absolute;z-index:1;margin:19px 0 0 19px;pointer-events:none}
.search-icon svg{width:20px;height:20px;fill:none;stroke:#8f8b83;stroke-width:1.8}

/* Search results on dark home */
.landing .search-results .section-title{color:#77746e;margin:5px 2px 9px}
.landing .search-results .brand-card{background:#1b1b19;border-color:rgba(255,255,255,.08);color:#f7f3e9}
.landing .search-results .brand-body{background:#1b1b19}
.landing .search-results .brand-title{color:#f7f3e9}
.landing .search-results .meta,.landing .search-results .distance,.landing .search-results .desc{color:#9b9891}
.landing .search-results .tag{border-color:rgba(255,255,255,.12);color:#b7b3aa}
.landing .search-results .cuisine-chip{background:#292925;color:#d9d5cc}
.landing .search-results .price{color:#f7f3e9}

/* Featured */
.feature-wrap{margin:4px 0 34px}
.static-feature{
  position:relative;aspect-ratio:16/8.5!important;height:auto!important;border-radius:25px;
  background:#222;overflow:hidden;border:1px solid rgba(255,255,255,.08);
  box-shadow:0 18px 40px rgba(0,0,0,.25)
}
.static-feature:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 30%,rgba(0,0,0,.72) 100%)}
.static-feature img{filter:saturate(.88);transition:transform .5s ease}
.static-feature:hover img{transform:scale(1.025)}
.feature-overlay{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff;display:flex;flex-direction:column;gap:5px}
.feature-overlay span{font-size:9px;font-weight:700;letter-spacing:.16em;opacity:.72}
.feature-overlay strong{font-family:"Space Grotesk",sans-serif;font-size:25px;line-height:1.02;letter-spacing:-.035em;font-weight:600}

/* Explore bento */
.explore-section{padding:0 1px}
.section-heading{display:flex;align-items:baseline;justify-content:space-between;margin:0 1px 12px}
.section-heading small{font-size:11px;color:#69665f}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.category-card{
  position:relative;min-height:148px!important;border:0!important;border-radius:24px!important;
  padding:18px!important;text-align:left!important;background:var(--c)!important;color:#111!important;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
}
.category-card:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-28px;top:-25px;background:rgba(255,255,255,.16)}
.category-food{--c:var(--food)}
.category-drink{--c:var(--drink)}
.category-dessert{--c:var(--dessert)}
.category-nightlife{--c:var(--nightlife)}
.category-activities{--c:var(--activities)}
.category-landmarks{--c:var(--landmarks)}
.category-icon{width:30px;height:30px;display:flex;align-items:center}
.category-icon svg{width:27px;height:27px;fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.category-name{font-family:"Space Grotesk",sans-serif;font-size:23px;letter-spacing:-.035em;font-weight:600;line-height:1}
.category-arrow{position:absolute;right:16px;bottom:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(17,17,15,.10)}
.category-arrow svg{width:15px;height:15px;fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Secondary pages */
.themed-page{min-height:calc(100vh - 100px);color:#111}
.themed-page.theme-food{--theme-bg:var(--food);--theme-ink:#2a1710}
.themed-page.theme-drink{--theme-bg:var(--drink);--theme-ink:#102018}
.themed-page.theme-dessert{--theme-bg:var(--dessert);--theme-ink:#261521}
.themed-page.theme-nightlife{--theme-bg:var(--nightlife);--theme-ink:#1b1428}
.themed-page.theme-activities{--theme-bg:var(--activities);--theme-ink:#102126}
.themed-page.theme-landmarks{--theme-bg:var(--landmarks);--theme-ink:#2a2110}
.themed-page.theme-transport{--theme-bg:var(--transport);--theme-ink:#172033}
.themed-page.theme-emergency{--theme-bg:var(--emergency);--theme-ink:#291313}
.themed-page{background:var(--theme-bg);color:var(--theme-ink)}
.themed-page .top .back,.themed-page .top .crumb{background:rgba(255,255,255,.48);border-color:rgba(0,0,0,.08);color:var(--theme-ink);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.themed-page .back{font-family:"DM Sans",sans-serif;font-size:26px}
.themed-page .crumb{font-family:"Space Grotesk",sans-serif;font-weight:600}

    if(now-lastAction<350){

      return;
    }
    lastAction=now;
  }, true);
})();

let userPos = null, currentPage="home", currentCategory="";

function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function initials(name){return String(name||"").split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join("").toUpperCase();}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-");}
function instagramUrl(handle){
  const h=String(handle||"").trim();
  if(!h) return "";

}
function directionsUrl(name,address){const destination=String(name||"")+ (address?", "+String(address):""); if(!destination.trim())return ""; return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(destination);}
function distanceKm(a,b,c,d){const R=6371, p=Math.PI/180, x=(c-a)*p, y=(d-b)*p;const q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
function distanceText(lat,lon){
  if(lat==null || lon==null) return "Location not mapped";
  if(!userPos) return "Enable location to see distance";
  let d=distanceKm(userPos.lat,userPos.lon,lat,lon);
  return d<1?Math.round(d*1000)+" m away":d.toFixed(1)+" km away";
}

function parseTime(s){
  let m=String(s||"").match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i); if(!m)return null;
  let h=+m[1], min=+(m[2]||0), ap=(m[3]||"").toUpperCase();
  if(ap==="PM"&&h<12)h+=12;
  if(ap==="AM"&&h===12)h=0;
  return h*60+min;
}
function dayKey(){return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];}
function fmtTime(mins){
  let h=Math.floor((mins%1440)/60), m=mins%60, ap=h>=12?"PM":"AM", hh=h%12||12;
  return hh+(m?":"+String(m).padStart(2,"0"):"")+ap;
}
function todaySlots(p){
  let h=p.hours||{};
  return h[dayKey()] ?? h.Daily ?? [];
}
function status(p){
  let slots=todaySlots(p);
  let now=new Date().getHours()*60+new Date().getMinutes();
  if(Array.isArray(slots)){
    for(const slot of slots){
      let open=parseTime(slot[0]), close=parseTime(slot[1]);
      if(open==null||close==null) continue;
      let end=close;
      if(end<=open) end+=1440;
      let n=now;
      if(n<open && end>1440) n+=1440;
      if(n>=open && n<end){
        let remaining=end-n;
        return {label:remaining<=60?"CLOSING SOON":"OPEN TIL "+fmtTime(end),kind:remaining<=60?"soon":"open"};
      }
    }
  }

  // When closed, show the next scheduled opening instead of simply "Closed".
  const h=p.hours||{};
  const dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  for(let offset=0; offset<7; offset++){
    const idx=(new Date().getDay()+offset)%7;
    const day=dayNames[idx];
    const daySlots=h[day] ?? h.Daily ?? [];
    if(!Array.isArray(daySlots)) continue;
    for(const slot of daySlots){
      const open=parseTime(slot[0]);
      if(open==null) continue;
      if(offset===0 && open<=now) continue;
      return {label:"OPENS AT "+fmtTime(open),kind:"closed"};
    }
  }
  return {label:"CLOSED",kind:"closed"};
}
function distanceVal(p){
  if(!userPos || p.lat==null || p.lon==null) return Infinity;
  return distanceKm(userPos.lat,userPos.lon,p.lat,p.lon);
}
function distanceLabel(p){
  if(p.lat==null || p.lon==null) return "Location not mapped";

    return "Enable location to see distance";
  }
  let d=distanceVal(p);
  return d<1 ? Math.round(d*1000)+" m away" : d.toFixed(1)+" km away";
}

let luRouting=false;
function routeHash(state){
  if(!state || state.view==="home") return "";
  if(state.view==="category") return "#/category/"+encodeURIComponent(state.cat||"");
  if(state.view==="brand") return "#/brand/"+encodeURIComponent(state.id||"");
  if(state.view==="page") return "#/page/"+encodeURIComponent(state.page||"");
  return "";
}
function stateFromHash(){
  const h=location.hash.replace(/^#\/?/,"");
  if(!h) return {luApp:true,view:"home"};
  const parts=h.split("/");
  const type=parts[0];
  const value=decodeURIComponent(parts.slice(1).join("/"));
  if(type==="category" && value) return {luApp:true,view:"category",cat:value};
  if(type==="brand" && value) return {luApp:true,view:"brand",id:value};
  if(type==="page" && value) return {luApp:true,view:"page",page:value};
  return {luApp:true,view:"home"};
}
function setRoute(state){
  const url=new URL(location.href);
  url.hash=routeHash(state);
  history.pushState(Object.assign({luApp:true},state), "", url.href);
}
function appBack(){
  if(history.state && history.state.luApp && history.state.view!=="home") history.back();
  else if(location.hash) history.back();
  else renderHome();
}
function renderRoute(state){
  luRouting=true;
  try{
    state=state && state.luApp ? state : stateFromHash();
    if(!state || state.view==="home") renderHome();
    else if(state.view==="category") showCategory(state.cat,true);
    else if(state.view==="brand") brandDetail(state.id,true);
    else if(state.view==="page") showPage(state.page,true);
  }finally{ luRouting=false; }
}

}

function sortCategoryBrands(arr,mode){

    out.sort((a,b)=>priceValue(a)-priceValue(b) || a.name.localeCompare(b.name));

}
function showLocationPrompt(){
  if(document.getElementById("locationPrompt")) return;
  let d=document.createElement("div");
  d.id="locationPrompt";
  d.className="location-modal";
  d.innerHTML='<div class="location-sheet"><div class="location-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.2"/></svg></div><h3>Turn on location</h3><p>Use your current location to show nearby places and sort Food by distance.</p><button class="btn primary" onclick="enableLocation()">Turn on location</button><button class="location-skip" onclick="closeLocationPrompt()">Not now</button></div>';
  document.body.appendChild(d);
}
function closeLocationPrompt(){let x=document.getElementById("locationPrompt");if(x)x.remove();}
let locationError="";
let locationWatchId=null;
function redrawAfterLocation(){
  if(currentPage==="category") showCategory(currentCategory);
  else if(currentPage==="landmarks") renderLandmarks();
  else if(currentPage==="nearby") renderNearby();
}
function locationErrorText(err){
  if(err && err.code===1) return "Location permission is blocked. Allow location for this site in your browser, then tap Try Again.";
  if(err && err.code===2) return "Your device could not determine your location. Turn on GPS/location services, then tap Try Again.";
  if(err && err.code===3) return "Location request timed out. Tap Try Again.";
  return "Your exact location is not available yet. Tap Try Again.";
}
function enableLocation(){
  if(!navigator.geolocation){
    locationError="This browser does not support location.";
    redrawAfterLocation();
    return;
  }
  locationError="Requesting your current location…";
  redrawAfterLocation();
  navigator.geolocation.getCurrentPosition(pos=>{
    userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};
    locationError="";
    closeLocationPrompt();
    redrawAfterLocation();
  },err=>{
    locationError=locationErrorText(err);
    closeLocationPrompt();
    redrawAfterLocation();
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function startLocationWatch(){
  if(!navigator.geolocation || locationWatchId!==null) return;
  locationWatchId=navigator.geolocation.watchPosition(pos=>{
    userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};
    locationError="";
    redrawAfterLocation();
  },err=>{
    locationError=locationErrorText(err);
    redrawAfterLocation();
  },{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
startLocationWatch();
const initialRoute=stateFromHash();
history.replaceState(initialRoute, "", location.href);
try{renderRoute(initialRoute);}catch(e){console.error(e);document.getElementById('app').innerHTML='<div style="padding:24px;font-family:Arial">Please refresh the page.</div>';}
</script>
</body></html>
