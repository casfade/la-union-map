function openCategory(cat){currentCategory=cat;currentSort='nearest';setPage('categoryPage');document.getElementById('categoryBreadcrumb').textContent='Home › '+cat;const labels={Food:'Food',Drinks:'Drink',Dessert:'Dessert',Bar:'Nightlife',Activities:'Activities'};document.querySelector('#categoryCover b').textContent=labels[cat]||cat;renderCategory()}
let currentSort='nearest';
function renderCategory(){
 const q=(document.getElementById('categorySearch')?.value||'').toLowerCase();
 const primary={Food:'Food',Drinks:'Drinks',Dessert:'Dessert',Bar:'Bar',Activities:'Activities'};
 let a=places.filter(p=>{
   const belongs=currentCategory==='Nearby Favorites'?true:(p.categories[0]===currentCategory);
   const text=`${p.name} ${p.handle} ${p.description} ${p.cuisine||''} ${p.barType||''}`.toLowerCase();
   return belongs&&text.includes(q);
 });
 if(currentCategory==='Nearby Favorites')a=a.filter(p=>distance(p)!==null);
 const cmp={alphabetical:(x,y)=>x.name.localeCompare(y.name),price:(x,y)=>x.price.length-y.price.length||x.name.localeCompare(y.name),nearest:(x,y)=>(isOpen(y)===true)-(isOpen(x)===true)||((distance(x)??Infinity)-(distance(y)??Infinity))||x.name.localeCompare(y.name),open:(x,y)=>(isOpen(y)===true)-(isOpen(x)===true)||((distance(x)??Infinity)-(distance(y)??Infinity))||x.name.localeCompare(y.name)}[currentSort]||((x,y)=>x.name.localeCompare(y.name));
 a.sort(cmp);
 const near=a.filter(p=>distance(p)!==null).sort((x,y)=>(isOpen(y)===true)-(isOpen(x)===true)||((distance(x)??Infinity)-(distance(y)??Infinity))||x.name.localeCompare(y.name)).slice(0,2);
 let out='';
 if(currentCategory!=='Nearby Favorites'&&near.length)out+=`<div class="section-label">Nearest to You<small>Open places are prioritized, then distance</small></div><div class="nearest-wrap">${near.map(card).join('')}</div>`;
 out+=`<div class="sortrow"><span>${a.length} places</span><select id="sortSelect" onchange="currentSort=this.value;renderCategory()"><option value="nearest" ${currentSort==='nearest'?'selected':''}>Nearest</option><option value="alphabetical" ${currentSort==='alphabetical'?'selected':''}>Alphabetical</option><option value="price" ${currentSort==='price'?'selected':''}>Price</option><option value="open" ${currentSort==='open'?'selected':''}>Open first</option></select></div>`;
 out+=a.length?`<div class="cards">${a.map(card).join('')}</div>`:`<div class="empty">${currentCategory==='Nearby Favorites'?'Allow location to see nearby favorites.':'Nothing found.'}</div>`;

}
function detail(id){const p=places.find(x=>x.id==id),o=isOpen(p),d=distance(p);setPage('detailPage');document.getElementById('detailBody').dataset.brandId=id;document.getElementById('detailBreadcrumb').textContent='Home › '+p.categories[0]+' › '+p.name;const sug=nearbyCards(p),dist=Number.isFinite(d)?(d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km'):'Location unavailable';document.getElementById('detailBody').innerHTML=`<div class="hero-carousel">${renderPhotos(p)}</div><div class="detail"><div class="detail-title-row"><h1>${esc(p.name)}</h1><span class="detail-status ${statusClass(p)}">${esc(detailStatusLabel(p))}</span></div>${p.categories.includes('Food')&&p.cuisine?`<div class="food-banner" style="background:${({Food:'var(--food)',Drinks:'var(--drinks)',Bar:'var(--bar)',Dessert:'var(--dessert)',Activities:'var(--activity)'})[p.categories[0]]||'var(--food)'}">${esc(p.cuisineIcon||'🍽️')} ${esc(p.cuisine)}</div>`:''}${p.categories.includes('Bar')&&p.barType?`<div class="food-banner bar-kind">${esc(p.barIcon||'🍸')} ${esc(p.barType)}</div>`:''}<div class="handle">@${esc(p.handle)}</div><div class="tagrow">${p.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div><p class="description">${esc(p.description)}</p><div class="highlight" onclick="instagram('${p.id}')"><div class="highlight-inner"><div class="highlight-photo" style="background:${({Food:'var(--food)',Drinks:'var(--drinks)',Bar:'var(--bar)',Dessert:'var(--dessert)',Activities:'var(--activity)'})[p.categories[0]]||'var(--line)'}">${p.photos?.[0]?`<img src="${esc(p.photos[0])}" alt="${esc(p.name)}">`:`<div class="fallback">${esc(p.name.replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase())}</div>`}</div><div class="highlight-copy"><small>HIGHLIGHT</small><b>${esc(p.highlight)}</b><span class="lead">A local favorite worth checking out — see the brand on Instagram for the latest photos and updates.</span></div></div></div><div class="info"><div class="row"><span>Today</span><b>${esc(currentSchedule(p))}</b></div><div class="row"><span>Price</span><b>${esc(priceText(p))}</b></div><div class="row"><span>Distance</span><b>${dist}</b></div><div class="row"><span>Address</span><b>${esc(p.address)}</b></div></div><div class="detail-actions"><button class="wide dark" onclick="go('${p.id}')">Maps</button><button class="wide light" onclick="instagram('${p.id}')">Instagram</button></div><div class="subsection" style="padding-left:0">More places nearby<small style="display:block;color:var(--muted);font-size:10px;margin-top:3px">Other brands close to this current brand area</small></div><div class="cards nearby" style="padding:0">${sug.length?sug.map(card).join(''):'<div class="empty">No nearby mapped brands yet.</div>'}</div></div>`}function renderPhotos(p){const a=(p.photos||[]).filter(Boolean);if(!a.length)return '<div class="hero-placeholder"><span>Recent photos</span><small>1080 × 1080</small></div>';return '<div class="photo-track">'+a.map((u,i)=>`<img src="${esc(u)}" alt="${esc(p.name)} photo ${i+1}">`).join('')+'</div><div class="photo-dots">'+a.map((_,i)=>`<span class="${i?'':'active'}"></span>`).join('')+'</div>'}
function geoDistance(a,b){
 if(!a||!b)return null;
 const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function nearbyCards(current){
 if(!current.coords)return [];
 return places
   .filter(p=>p.id!==current.id&&p.coords)
   .map(p=>({p,d:geoDistance(current.coords,p.coords)}))
   .sort((a,b)=>(a.d-b.d)||a.p.name.localeCompare(b.p.name))
   .slice(0,4)
   .map(x=>x.p);
}
function instagram(id){const p=places.find(x=>x.id==id);if(!p)return;const url='https://www.instagram.com/'+p.handle+'/';window.location.href=url}
function go(id){
 const p=places.find(x=>x.id==id);
 let url=p.coords?`https://www.google.com/maps/dir/?api=1&destination=${p.coords[0]},${p.coords[1]}&destination_place_id=&travelmode=driving`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+" "+p.address+" La Union")}`;
 addHistory(p);window.location.href=url;
}
function addHistory(p){
 let h=JSON.parse(localStorage.getItem("lu_history")||"[]");
 h.unshift({name:p.name,time:new Date().toISOString()});localStorage.setItem("lu_history",JSON.stringify(h.slice(0,40)));
}
function renderHistory(){

 document.getElementById("historyList").innerHTML=h.length?h.map(x=>`<div class="historyitem"><b>${esc(x.name)}</b><small>${new Date(x.time).toLocaleString()}</small></div>`).join(""):`<div class="empty">Your places will appear here after you tap Maps.</div>`;
}
function initMap(){
 if(map)return;
 map=L.map("realMap",{zoomControl:true}).setView([16.6697,120.3198],15);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
 renderMapMarkers();setTimeout(()=>map.invalidateSize(),150);
}
function renderMapMarkers(){
 if(!map)return;markers.forEach(m=>m.remove());markers=[];
 places.filter(p=>p.coords).forEach(p=>{
  let m=L.marker(p.coords).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.category)} · ${esc(p.price)}<br><button class="btn view" onclick="detail('${p.id}')">View</button>`);
  markers.push(m);
 });
}
function requestLocation(){
 locationStatus="locating";updateLocationUI();
 if(!navigator.geolocation){locationStatus="unsupported";updateLocationUI();return;}
 if(window.locationWatchId)navigator.geolocation.clearWatch(window.locationWatchId);
 window.locationWatchId=navigator.geolocation.watchPosition(pos=>{
   userPos=[Number(pos.coords.latitude),Number(pos.coords.longitude)];
   locationStatus="ready";updateLocationUI();
   if(document.getElementById("categoryPage")?.classList.contains("active"))renderCategory();
   if(document.getElementById("detailPage")?.classList.contains("active")){
     const id=document.getElementById("detailBody")?.dataset?.brandId;
     if(id!==undefined)detail(id);
   }
 },err=>{
   locationStatus=err.code===1?"denied":err.code===2?"unavailable":"timeout";updateLocationUI();
 },{enableHighAccuracy:true,maximumAge:30000,timeout:15000});
}
function updateLocationUI(){
 const el=document.getElementById("locationStatus");if(!el)return;
 if(locationStatus==="locating")el.innerHTML='<div class="locating">📍 Locating you…</div>';
 else if(locationStatus==="ready")el.innerHTML='<div class="located">📍 Location active</div>';
 else el.innerHTML='<button class="location-enable" onclick="requestLocation()">Enable Location</button>';
}

<style>
