*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{font-size:15px;font-weight:400}.app{max-width:var(--max);margin:auto;min-height:100vh;padding-bottom:28px}

.page{padding:18px 16px 32px}.landing{padding-top:12px}
.search{display:flex;gap:8px;margin-bottom:20px}

.feature-wrap{margin-bottom:28px}

.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.dot{width:6px;height:6px;border-radius:50%;background:#bbb}.dot.active{background:#333}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:0 0 10px;color:#666}

.meta{font-size:12px;color:#666;margin-top:6px}.desc{font-size:13px;line-height:1.45;margin-top:7px}.highlight{font-size:12px;font-weight:700;margin-top:8px}

<script>
(function(){
  let lastAction=0;
  document.addEventListener('click', function(e){
    const interactive=e.target.closest('a,button,[role="button"],.card,.category-card,.feature-card');
    if(!interactive) return;
    const now=Date.now();
    if(now-lastAction<350){
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    lastAction=now;
  }, true);
})();
</script>

function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function initials(name){return String(name||"").split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join("").toUpperCase();}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-");}
function instagramUrl(handle){
  const h=String(handle||"").trim();
  if(!h) return "";
  if(/^https?:\/\//i.test(h)) return h;
  return "https://www.instagram.com/"+encodeURIComponent(h.replace(/^@/,""))+"/";
}
function directionsUrl(name,address){const destination=String(name||"")+ (address?", "+String(address):""); if(!destination.trim())return ""; return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(destination);}
function distanceKm(a,b,c,d){const R=6371, p=Math.PI/180, x=(c-a)*p, y=(d-b)*p;const q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
function distanceText(lat,lon){
  if(lat==null || lon==null) return "Location not mapped";
  if(!userPos) return "Enable location to see distance";
  let d=distanceKm(userPos.lat,userPos.lon,lat,lon);
  return d<1?Math.round(d*1000)+" m away":d.toFixed(1)+" km away";
}

function parseTime(s){
  let m=String(s||"").match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i); if(!m)return null;
  let h=+m[1], min=+(m[2]||0), ap=(m[3]||"").toUpperCase();
  if(ap==="PM"&&h<12)h+=12;
  if(ap==="AM"&&h===12)h=0;
  return h*60+min;
}
function dayKey(){return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];}
function fmtTime(mins){
  let h=Math.floor((mins%1440)/60), m=mins%60, ap=h>=12?"PM":"AM", hh=h%12||12;
  return hh+(m?":"+String(m).padStart(2,"0"):"")+ap;
}
function todaySlots(p){
  let h=p.hours||{};
  return h[dayKey()] ?? h.Daily ?? [];
}
function status(p){
  let slots=todaySlots(p);
  if(!Array.isArray(slots) || !slots.length) return {label:"Closed",kind:"closed"};
  let now=new Date().getHours()*60+new Date().getMinutes();
  for(const slot of slots){
    let open=parseTime(slot[0]), close=parseTime(slot[1]);
    if(open==null||close==null) continue;
    let end=close;
    if(end<=open) end+=1440;
    let n=now;
    if(n<open && end>1440) n+=1440;
    if(n>=open && n<end){
      let remaining=end-n;
      return {label:"Open til "+fmtTime(end),kind:remaining<=60?"soon":"open"};
    }
  }
  return {label:"Closed",kind:"closed"};
}
function distanceVal(p){
  if(!userPos || p.lat==null || p.lon==null) return Infinity;
  return distanceKm(userPos.lat,userPos.lon,p.lat,p.lon);
}
function distanceLabel(p){
  if(p.lat==null || p.lon==null) return "Location not mapped";
  if(!userPos){
    if(locationError && locationError !== "Requesting your current location…") return "Enable location to see distance";
    return "Enable location to see distance";
  }
  let d=distanceVal(p);
  return d<1 ? Math.round(d*1000)+" m away" : d.toFixed(1)+" km away";
}
function cardImage(p, cls="brand-image"){

  let cat=p.primary||"Food"; return '<div class="'+cls+'" style="background:'+({"Food":"#E7D7C9","Drink":"#DDE7E0","Dessert":"#E9DFE8","Nightlife":"#DED9E7","Activities":"#DCE6E8","Landmarks":"#E4E0D4"}[cat]||"#ddd")+'"></div>';
}
function brandCard(p){
  const st=status(p), cats=p.categories||[], price=p.price||"";
  return '<article class="card brand-card" onclick="brandDetail(\''+p.id+'\')">'+

    '<div class="tags">'+cats.map(c=>'<span class="tag">'+escapeHtml(c)+'</span>').join("")+'</div></div></article>';
}

  const coverImages={"Food": "https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1400&q=85", "Drink": "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=1400&q=85", "Dessert": "https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=1400&q=85", "Nightlife": "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=1400&q=85", "Activities": "https://images.unsplash.com/photo-1502680390469-be75c86b636f?auto=format&fit=crop&w=1400&q=85", "Landmarks": "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=85", "Emergency": "https://images.unsplash.com/photo-1584467735871-7d0c7b1c3b3e?auto=format&fit=crop&w=1400&q=85", "Transport": "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=1400&q=85"};

let luRouting=false;
function routeHash(state){
  if(!state || state.view==="home") return "";
  if(state.view==="category") return "#/category/"+encodeURIComponent(state.cat||"");
  if(state.view==="brand") return "#/brand/"+encodeURIComponent(state.id||"");
  if(state.view==="page") return "#/page/"+encodeURIComponent(state.page||"");
  return "";
}
function stateFromHash(){
  const h=location.hash.replace(/^#\/?/,"");
  if(!h) return {luApp:true,view:"home"};
  const parts=h.split("/");
  const type=parts[0];
  const value=decodeURIComponent(parts.slice(1).join("/"));
  if(type==="category" && value) return {luApp:true,view:"category",cat:value};
  if(type==="brand" && value) return {luApp:true,view:"brand",id:value};
  if(type==="page" && value) return {luApp:true,view:"page",page:value};
  return {luApp:true,view:"home"};
}
function setRoute(state){
  const url=new URL(location.href);
  url.hash=routeHash(state);
  history.pushState(Object.assign({luApp:true},state), "", url.href);
}
function appBack(){
  if(history.state && history.state.luApp && history.state.view!=="home") history.back();
  else if(location.hash) history.back();
  else renderHome();
}
function renderRoute(state){
  luRouting=true;
  try{
    state=state && state.luApp ? state : stateFromHash();
    if(!state || state.view==="home") renderHome();
    else if(state.view==="category") showCategory(state.cat,true);
    else if(state.view==="brand") brandDetail(state.id,true);
    else if(state.view==="page") showPage(state.page,true);
  }finally{ luRouting=false; }
}
window.addEventListener("popstate",function(e){ renderRoute(e.state || stateFromHash()); });
function syncRouteOnHash(){
  if(luRouting) return;
  const state=stateFromHash();
  history.replaceState(state,"",location.href);
  renderRoute(state);
}
window.addEventListener("hashchange",syncRouteOnHash);
function renderHome(){
  if(!luRouting){
    const url=new URL(location.href); url.hash="";
    history.replaceState({luApp:true,view:"home"}, "", url.href);
  }
  currentPage="home"; currentCategory="";
  document.getElementById("tabs").classList.remove("hidden");
  let featured='<section class="feature-wrap"><div class="feature-card static-feature"><img src="'+STATIC_PHOTO+'" alt="La Union beach"></div></section>';
  let html='<div class="page landing"><div class="search"><input id="homeSearch" placeholder="Where are you going today?.." oninput="searchHome(this.value)"></div>'+
    '<section id="searchFeed" class="list search-results" style="margin-top:-10px;margin-bottom:20px"></section>'+featured+
    '<section><div class="section-title">Explore</div><div class="bento">'+cats.map(c=>'<button style="--c:'+({"Food":"#E7D7C9","Drink":"#DDE7E0","Dessert":"#E9DFE8","Nightlife":"#DED9E7","Activities":"#DCE6E8","Landmarks":"#E4E0D4"}[c])+'" onclick="showCategory(\''+c+'\')"><span class="emoji">'+icons[c]+'</span>'+c+'</button>').join("")+'</div></section></div>';
  document.getElementById("app").innerHTML=html;
}
function searchHome(q){
  q=q.trim().toLowerCase(); let box=document.getElementById("searchFeed"); if(!box)return;
  if(!q){box.innerHTML="";return}
  let arr=DATA.brands.filter(b=>(b.name+" "+b.description+" "+b.cuisine+" "+b.venue).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=arr.length?'<div class="section-title">Results</div>'+arr.map(brandCard).join(""):'<div class="empty">No matches yet.</div>';
}
function categoryStatusRank(p){
  const s=status(p);
  return s.kind==="open" ? 0 : s.kind==="soon" ? 1 : 2;
}
function sortCategoryBrands(arr,mode){
  const out=arr.slice();
  if(mode==="alpha"){
    out.sort((a,b)=>a.name.localeCompare(b.name));
  }else if(mode==="price"){
    out.sort((a,b)=>priceValue(a)-priceValue(b) || a.name.localeCompare(b.name));
  }else if(mode==="distance"){
    out.sort((a,b)=>distanceVal(a)-distanceVal(b) || a.name.localeCompare(b.name));
  }else{
    out.sort((a,b)=>categoryStatusRank(a)-categoryStatusRank(b) || distanceVal(a)-distanceVal(b) || a.name.localeCompare(b.name));
  }
  return out;
}
function priceValue(p){
  const m=String(p.price||"").replace(/[^0-9]/g,"");
  return m ? Number(m) : 999999;
}
function showCategory(cat,fromHistory){
  if(!fromHistory && !luRouting) setRoute(cat==="Landmarks"?{view:"page",page:"landmarks"}:{view:"category",cat:cat});
  if(cat==="Landmarks"){renderLandmarks();return;}
  currentPage="category"; currentCategory=cat; document.getElementById("tabs").classList.add("hidden");
  let all=DATA.brands.filter(b=>b.primary===cat);
  all.sort((a,b)=>distanceVal(a)-distanceVal(b));
  const nearby=all.slice(0,2);
  const rest=all.slice(2);
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="appBack()">‹</button><div class="crumb">'+escapeHtml(cat)+'</div></div>'+cover(cat,cat)+
    (nearby.length?'<div class="category-section-title">NEARBY</div><div class="list">'+nearby.map(brandCard).join("")+'</div>':'')+
    '<div class="category-section-title">ALL '+escapeHtml(cat.toUpperCase())+'</div>'+
    '<div class="sorts" aria-label="Sort category"><button class="active" onclick="sortBrands(this,\'open\')">Open first</button><button onclick="sortBrands(this,\'distance\')">Nearest</button><button onclick="sortBrands(this,\'alpha\')">A–Z</button><button onclick="sortBrands(this,\'price\')">₱ Price</button></div>'+
    '<div id="brandList" class="list">'+sortCategoryBrands(rest,"open").map(brandCard).join("")+'</div></div>';
}
function sortBrands(btn,mode){
  document.querySelectorAll(".sorts button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  const arr=DATA.brands.filter(b=>b.primary===currentCategory);
  const all=arr.slice();
  all.sort((a,b)=>distanceVal(a)-distanceVal(b));
  const rest=all.slice(2);
  document.getElementById("brandList").innerHTML=sortCategoryBrands(rest,mode).map(brandCard).join("");
}
function brandDetail(id,fromHistory){
  if(!fromHistory && !luRouting) setRoute({view:"brand",id:id});
  let p=DATA.brands.find(x=>x.id===id);if(!p)return;document.getElementById("tabs").classList.add("hidden");
  let st=status(p), photo=p.photos&&p.photos[0];
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="appBack()">‹</button><div class="crumb">'+escapeHtml(p.primary)+'</div></div>'+
  '<div class="cover detail-cover">'+(photo?'<img src="'+escapeHtml(photo)+'" alt="">':'<div class="cover-fallback" style="background:'+({"Food":"#E7D7C9","Drink":"#DDE7E0","Dessert":"#E9DFE8","Nightlife":"#DED9E7","Activities":"#DCE6E8","Landmarks":"#E4E0D4"}[p.primary]||"#ddd")+'">'+'</div>')+'</div>'+
  '<div class="detail-name-row"><div class="detail-name">'+escapeHtml(p.name)+'</div><div class="status-pill status-'+escapeHtml(st.kind)+'">'+escapeHtml(st.label)+'</div></div>'+
  (p.cuisine||p.venue?'<div class="cuisine-banner">'+escapeHtml((p.country?p.country+" ":"")+(p.cuisine||"")+(p.venue?" · "+p.venue:""))+'</div>':'')+
  '<div class="btn-row detail-actions"><a class="btn" href="'+directionsUrl(p.name,p.address)+'">Maps</a>'+(p.ig?'<a class="btn light" href="'+escapeHtml(instagramUrl(p.ig))+'" target="_blank" rel="noopener">Instagram</a>':'')+'</div>'+
  '<div class="detail-section"><h3>About</h3><p>'+escapeHtml(p.description)+'</p></div>'+
  (p.highlight?'<div class="detail-section"><h3>Highlight</h3><p>'+escapeHtml(p.highlight)+'</p></div>':'')+
  '<div class="hours-calendar-card"><div class="detail-label">HOURS</div><div class="hours-calendar-grid">'+["Fri","Sat","Sun","Mon","Tue","Wed","Thu"].map(function(d){
    const slots=(p.hours||{})[d] ?? (p.hours||{}).Daily ?? [];
    const value=Array.isArray(slots)&&slots.length ? slots.map(function(x){return x[0]+"–"+x[1]}).join("<br>") : "Closed";
    const names={Fri:"Friday",Sat:"Saturday",Sun:"Sunday",Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday"};
    return '<div class="hours-day-card"><div class="hours-day-name">'+names[d]+'</div><div class="hours-day-time">'+value+'</div></div>';
  }).join("")+'</div></div>'+
  '<div class="detail-section"><h3>Location</h3><p>'+escapeHtml(p.address||"Location unavailable")+'</p></div></div>';
}
function showPage(page,fromHistory){
  if(!fromHistory && !luRouting) setRoute({view:"page",page:page});
  document.getElementById("tabs").classList.remove("hidden");
  if(page==="transport")renderTransport();
  else if(page==="nearby")renderNearby();
  else if(page==="emergency")renderEmergency();
}
function nearbySorted(mode){
  const arr=DATA.brands.slice();
  if(mode==="alpha") arr.sort((a,b)=>a.name.localeCompare(b.name));
  else if(mode==="price") arr.sort((a,b)=>priceValue(a)-priceValue(b)||a.name.localeCompare(b.name));
  else if(mode==="distance") arr.sort((a,b)=>distanceVal(a)-distanceVal(b)||a.name.localeCompare(b.name));
  else arr.sort((a,b)=>categoryStatusRank(a)-categoryStatusRank(b)||distanceVal(a)-distanceVal(b)||a.name.localeCompare(b.name));
  return arr;
}
function renderNearby(mode="open"){
  currentPage="nearby";
  document.getElementById("tabs").classList.add("hidden");
  const arr=nearbySorted(mode);
  const near=nearbySorted("distance").slice(0,2);
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="appBack()">‹</button><div class="crumb">Nearby</div></div>'+cover("Nearby","Activities")+'<div class="nearest"><h3>Nearest Favorites</h3><div class="list">'+near.map(brandCard).join("")+'</div></div><div class="sorts" aria-label="Sort nearby"><button class="'+(mode==="open"?"active":"")+'" onclick="sortNearby(this,&quot;open&quot;)">Open first</button><button class="'+(mode==="alpha"?"active":"")+'" onclick="sortNearby(this,&quot;alpha&quot;)">A–Z</button><button class="'+(mode==="price"?"active":"")+'" onclick="sortNearby(this,&quot;price&quot;)">₱ Price</button><button class="'+(mode==="distance"?"active":"")+'" onclick="sortNearby(this,&quot;distance&quot;)">Distance</button></div><div id="nearbyList" class="list">'+arr.map(brandCard).join("")+'</div></div>';
}
function sortNearby(btn,mode){
  const arr=nearbySorted(mode);
  document.querySelectorAll(".sorts button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  const list=document.getElementById("nearbyList");
  if(list) list.innerHTML=arr.map(brandCard).join("");
}
function renderLandmarks(){
  currentPage="landmarks"; currentCategory="Landmarks";
  document.getElementById("tabs").classList.add("hidden");
  let arr=DATA.landmarks.slice().sort((a,b)=>distanceVal(a)-distanceVal(b) || a.name.localeCompare(b.name));
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="appBack()">‹</button><div class="crumb">Landmarks</div></div>'+cover("Landmarks","Landmarks")+'<div class="sorts"><button class="active" onclick="sortLand(this,\'distance\')">Distance</button><button onclick="sortLand(this,\'alpha\')">A–Z</button><button onclick="sortLand(this,\'nearest\')">Nearest</button></div><div id="landmarkLocationNote" class="location-note"></div><div id="landmarkList" class="list">'+arr.map(landmarkCard).join("")+'</div></div>';
  updateLandmarkLocationNote();
}
function distanceVal(x){return userPos&&x.lat!=null&&x.lon!=null?distanceKm(userPos.lat,userPos.lon,x.lat,x.lon):9999}
function landmarkCard(l){
  let go=directionsUrl(l.name,l.address);
  let dist=distanceText(l.lat,l.lon);
  let distanceHtml=(l.lat==null || l.lon==null)
    ? '<div class="landmark-distance">Location not mapped</div>'
    : userPos
      ? '<div class="landmark-distance">'+escapeHtml(dist)+'</div>'
      : '<div class="landmark-distance">Enable location to see distance</div>';
  let goHtml=go?'<a class="btn landmark-go" href="'+escapeHtml(go)+'" target="_blank" rel="noopener">Go Here</a>':'<button class="btn landmark-go" onclick="enableLocation()">Try Location</button>';
  return '<article class="card landmark-card"><div class="landmark-icon">'+escapeHtml(l.icon)+'</div><div class="landmark-main"><div class="landmark-name">'+escapeHtml(l.name)+'</div>'+distanceHtml+'<div class="landmark-desc">'+escapeHtml(l.description)+'</div></div>'+goHtml+'</article>'
}
function updateLandmarkLocationNote(){
  let el=document.getElementById("landmarkLocationNote"); if(!el)return;
  if(userPos){
    el.innerHTML='Distances use your current GPS location. <button class="location-inline" onclick="enableLocation()">Refresh location</button>';
  }else{
    el.innerHTML='<span>'+escapeHtml(locationError||"Location permission is needed for exact distance.")+'</span> <button class="location-inline" onclick="enableLocation()">Try Again</button>';
  }
}
function sortLand(btn,mode){document.querySelectorAll(".sorts button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");let a=DATA.landmarks.slice();if(mode==="alpha")a.sort((x,y)=>x.name.localeCompare(y.name));else a.sort((x,y)=>distanceVal(x)-distanceVal(y)||x.name.localeCompare(y.name));document.getElementById("landmarkList").innerHTML=a.map(landmarkCard).join("");updateLandmarkLocationNote()}
function renderTransport(){
  document.getElementById("tabs").classList.add("hidden");
  let type="Tricycle Drivers";
  function render(){
    let arr=DATA.transport.filter(x=>x.type===type);
    document.getElementById("transportList").innerHTML=arr.map(t=>'<article class="card transport-row"><div class="profile">'+(t.photo?'<img class="profile" src="'+escapeHtml(t.photo)+'">':escapeHtml(initials(t.name)))+'</div><div class="transport-info"><div class="transport-name">'+escapeHtml(t.name)+'</div><div class="transport-desc">'+escapeHtml(t.description)+'</div></div><a class="btn" href="'+escapeHtml(t.facebook)+'">Book</a></article>').join("");
  }
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="appBack()">‹</button><div class="crumb">Transport</div></div>'+cover("Transport","Activities")+'<div style="height:12px"></div><div class="transport-tabs">'+["Tricycle Drivers","Motorcycle Rental","Car Rental"].map((x,i)=>'<button class="'+(i===0?"active":"")+'" onclick="selectTransportTab(this,\''+x+'\')">'+x+'</button>').join("")+'</div><div id="transportList" class="list"></div></div>';
  window.selectTransportTab=function(btn,nextType){type=nextType;document.querySelectorAll(".transport-tabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render();};
  render();
}
function renderEmergency(){
  document.getElementById("tabs").classList.add("hidden");
  document.getElementById("app").innerHTML='<div class="page"><div class="top"><button class="back" onclick="appBack()">‹</button><div class="crumb">Emergency</div></div>'+cover("Emergency","Nightlife")+'<div class="list">'+DATA.emergency.map(e=>'<article class="card em-row"><div><div class="em-name">'+escapeHtml(e.icon+" "+e.name)+'</div><div class="em-desc">'+escapeHtml(e.description)+' · '+escapeHtml(e.phone)+'</div></div><a class="btn call" href="tel:'+escapeHtml(e.phone.replace(/[^0-9+]/g,""))+'">Call Now</a></article>').join("")+'</div></div>';
}
function showLocationPrompt(){
  if(document.getElementById("locationPrompt")) return;
  let d=document.createElement("div");
  d.id="locationPrompt";
  d.className="location-modal";
  d.innerHTML='<div class="location-sheet"><div class="location-icon">⌖</div><h3>Turn on location</h3><p>Use your current location to show nearby places and sort Food by distance.</p><button class="btn primary" onclick="enableLocation()">Turn on location</button><button class="location-skip" onclick="closeLocationPrompt()">Not now</button></div>';
  document.body.appendChild(d);
}
function closeLocationPrompt(){let x=document.getElementById("locationPrompt");if(x)x.remove();}
let locationError="";
let locationWatchId=null;
function redrawAfterLocation(){
  if(currentPage==="category") showCategory(currentCategory);
  else if(currentPage==="landmarks") renderLandmarks();
  else if(currentPage==="nearby") renderNearby();
}
function locationErrorText(err){
  if(err && err.code===1) return "Location permission is blocked. Allow location for this site in your browser, then tap Try Again.";
  if(err && err.code===2) return "Your device could not determine your location. Turn on GPS/location services, then tap Try Again.";
  if(err && err.code===3) return "Location request timed out. Tap Try Again.";
  return "Your exact location is not available yet. Tap Try Again.";
}
function enableLocation(){
  if(!navigator.geolocation){
    locationError="This browser does not support location.";
    redrawAfterLocation();
    return;
  }
  locationError="Requesting your current location…";
  redrawAfterLocation();
  navigator.geolocation.getCurrentPosition(pos=>{
    userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};
    locationError="";
    closeLocationPrompt();
    redrawAfterLocation();
  },err=>{
    locationError=locationErrorText(err);
    closeLocationPrompt();
    redrawAfterLocation();
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function startLocationWatch(){
  if(!navigator.geolocation || locationWatchId!==null) return;
  locationWatchId=navigator.geolocation.watchPosition(pos=>{
    userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};
    locationError="";
    redrawAfterLocation();
  },err=>{
    locationError=locationErrorText(err);
    redrawAfterLocation();
  },{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
startLocationWatch();
const initialRoute=stateFromHash();
history.replaceState(initialRoute, "", location.href);
try{renderRoute(initialRoute);}catch(e){console.error(e);document.getElementById('app').innerHTML='<div style="padding:24px;font-family:Arial">Please refresh the page.</div>';}
</script>
</body></html>
